SET PATH_CENTRAL=axor3344-2_arcelor
SET MAP_PATH=${PATH_CENTRAL}/geodata/map_arcelor-20241113-4/map_files_fastslam_2
#SET GRAPH_PATH=${PATH_CENTRAL}/geodata/graph_log-volta_bq0-bq4_arcelor-3_atual.gr
SET GRAPH_PATH=${PATH_CENTRAL}/geodata/map_arcelor-20241113-4/graph/graph_arcelor_20241212_150m.gr
#SET ANNOTATION_PATH=${PATH_CENTRAL}/geodata/annotation _arcelor_volta_das_bqs.txt
SET ANNOTATION_PATH=${PATH_CENTRAL}/geodata/annotations/annotation_arcelor_20241204.txt
SET RDDF_PATH=${PATH_CENTRAL}/geodata/rddf/rddf_comboio_bq4_esquerda-20241212.txt
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/astro-mercedes-axor3344-2-sensorbox-6_arcelor.ini
SET AUDIT_PATH=/dados/audits/arcelor/audit_20241216_4/audit_20241216_4.txt

# Exemplo de entrada de proccontrol:
#module name 		group_name	requested_state	watch_heartbeats	command_line
#### Serviccos de suporte
 param_daemon		support 	1		0			./param_daemon ${PARAM_DAEMON_PATH}
 playback		    support 	1		0			./playback ${AUDIT_PATH}
 playback_control	support 	1		0			./playback_control -message 't 0'
 proc_control		support 	1		0			./proccontrol_gui
 map_server        	support		1       0           ./map_server -map_path ${MAP_PATH} # -map_x 7486508.33 -map_y -315918.45 -block_map on  -lanemap_incoming_message_type 0

#### Processamento dos dados dos Sensores
 gps_xyz		    sensor_filter	1		0		./gps_xyz
 base_ackerman		sensor_filter	1		0		./base_ackerman
 ND					 detection     1       0       ./neural_detector intelbras3 3 
 MOT				 detection     1       0       ./multiple_object_tracker intelbras3 3 -lidar 7 -lidar 8 -detect_always 1 -calibrate_camera 1


#### SLAM
 localize            SLAM          0        0      ./localize_ackerman -mapping_mode off -lidar 0 -lidar_theta off
 mapper              SLAM          1        0      ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0      ./obstacle_distance_mapper

#### hierarquia de controle (top-down)
 task_manager		 support	   0		0	   ./task_manager -mission ${MISSION_PATH} -start_delay off -mission_from_user_app on
 route_planner       planner       1        0      ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH}
 offroad_planner     planner       1        0      ./offroad_planner
 behavior_selector   planner       1        0      ./behavior_selector
 mpp                 planner       1        0      ./mpp
 obstacle_avoider    planner       1        0      ./obstacle_avoider
 rndf_build          planner       0        0      ./rddf_build ${RDDF_PATH}

#### Interfaces
 navigator_gui	interface	1		0			./navigator_gui2 -map_path ${MAP_PATH} -annotation_path ${ANNOTATION_PATH}
 viewer_3D		interface	1		0			./viewer_3D
 camera3		monitors	1		0			./camera_viewer 3
