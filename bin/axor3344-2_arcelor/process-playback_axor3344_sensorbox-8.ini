SET PATH_CENTRAL=axor3344_itaqui

#SET LOG_PATH=/dados2/audit/audit_20240215_2/audit_20240215_2.txt
SET LOG_PATH=/dados/itaqui/log-circuito-completo-curva-fechada-ladoA-20240722.txt

#SET MAP_PATH=${PATH_CENTRAL}/geodata/map-circuito-itaqui-astro2i-ladob-20231110/maps_files/map_files_merged_ladoa3
SET MAP_PATH=${PATH_CENTRAL}/geodata/map-circuito-itaqui-astro2i-ladob-20231110/maps_files/map_files_merged_ladoa7

#SET RDDF_PATH=${PATH_CENTRAL}/geodata/map-circuito-itaqui-astro2i-ladob-20231110/rddf-log-circuito-itaqui-astro2i-ladob-20231117.txt
SET RDDF_PATH=/dados/itaqui/rddfs/

SET GRAPH_PATH=${PATH_CENTRAL}/geodata/map-circuito-itaqui-astro2i-ladob-20231110/graphs/grafo_completo_20240410/grafo_desveio_cone1_20240515.gr
SET ANNOTATION_PATH=${PATH_CENTRAL}/geodata/map-circuito-itaqui-astro2i-ladob-20231110/annotations/rddf-annotation-2023-11-16_17-31-46.txt
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/astro-mercedes-axor3344-sensorbox-8.ini

#### serviccos de suporte
 param_daemon        support       1       0       ./param_daemon -l ${LOG_PATH}
 playback            support       1       0       ./playback ${LOG_PATH}
 playback_control    support       1       0       ./playback_control -message 't 0'
 proccontrol_gui     support       1       0       ./proccontrol_gui
 map_server          support       1       0       ./map_server -map_path ${MAP_PATH} -block_map on # -map_x 7989987.32 -map_y -205067.64

#### processamento dos dados dos sensores
 gps_xyz             filter        1       0       ./gps_xyz
 base_ackerman       filter        1       0       ./base_ackerman
 ND					 detection     0       0       ./neural_detector intelbras3 3 
 MOT				 detection     0       0       ./multiple_object_tracker intelbras3 3 -lidar 7 -detect_always 1 -calibrate_camera 1
#camera3              sensors       1       0       ./camera_drivers intelbras3 3
camera4              sensors       0       0       ./camera_drivers intelbras4 4

#### SLAM
 fused_odometry      SLAM          0        0      ./fused_odometry
 localize            SLAM          1        0      ./localize_ackerman -mapping_mode off -lidar 0
 mapper              SLAM          1        0      ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0      ./obstacle_distance_mapper
 ArUco               SLAM          0        0       ./aruco_theta_tracker 1 intelbras4 4 -show on

#### hierarquia de controle (top-down)
 route_planner       planner       1        0      ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH}
 offroad_planner     planner       0        0      ./offroad_planner
 behavior_selector   planner       1        0      ./behavior_selector
 model_predictive    planner       1        0      ./mpp
 obstacle_avoider    planner       1        0      ./obstacle_avoider
 rddf_build          planner       0        0      ./rddf_build ${RDDF_PATH}

#### interfaces
 navigator_gui       interface     1        0      ./navigator_gui2 -map_path ${MAP_PATH} -annotation_path ${ANNOTATION_PATH}
 viewer_3D           interface     1        0      ./viewer_3D
 #Camera1             monitors      1        0      ./camera_viewer 2
 Camera4             monitors      0       0       ./camera_viewer 4
