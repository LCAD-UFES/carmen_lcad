#### serviccos de suporte
 param_daemon        support       1       0       ./param_daemon ${PARAM_DAEMON_PATH}
 proccontrol_gui     support       1       0       ./proccontrol_gui
 map_server          support       1       0       ./map_server -map_path ${MAP_PATH} -block_map on  -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 gps_xyz             filter        1       0       ./gps_xyz
# base_ackerman      filter        1       0       ./base_ackerman

#### Carro
 simulator 		support 	       1	    0		./simulator_ackerman > results_pid.txt

#### SLAM
 localize            SLAM          1        0      ./localize_ackerman -mapping_mode off 
 mapper              SLAM          1        0      ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0      ./obstacle_distance_mapper

#### hierarquia de controle (top-down)
 task_manager		 support	   0		0	   ./task_manager -mission ${MISSION_PATH} -start_delay off -mission_from_user_app on
 route_planner       planner       1        0      ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH}
 NLP-MatPlan         planner       1        0      ./nlp_matplan
 behavior_selector   planner       1        0      ./behavior_selector
 MPP			     planner   	   1		0	   ./model_predictive_planner
 obstacle_avoider    planner       1        0      ./obstacle_avoider
 rndf_build          planner       0        0      ./rddf_build ${RDDF_PATH}

#### interfaces
 navigator_gui       interface     1        0      ./navigator_gui2 -map_path ${MAP_PATH} -annotation_path ${ANNOTATION_PATH}
 viewer_3D           interface     1        0      ./viewer_3D 
 

