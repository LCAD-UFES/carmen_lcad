# TESTE: globalpos vindo do SC-LIO-SAM (ARGOS / Unitree Go2)
#
# Port do process-playback_iara-sc-globalpos.ini. Mesma cadeia:
#   SC-LIO-SAM --/lio_sam/mapping/odometry--> fused_odometry_from_slam_node
#              --astro_fused_odometry_message (IPC)--> localize_ackerman -mapping_mode on
#              --astro_localize_ackerman_globalpos--> mapper, mss, viewer_3D, ...
#
# Em -mapping_mode on o localize NAO roda o filtro de particulas: ele monta o
# globalpos inteiramente a partir da fused_odometry (localize_ackerman_main.cpp:3665
# -> publish_globalpos_on_mapping_mode:3388), ainda interpolando a pose ate' o
# instante do scan. Quem publica fused_odometry controla o globalpos.
#
# PRE-REQUISITOS:
#   1. O modulo fused_odometry do ASTRO NAO pode subir (nao esta neste process).
#   2. A origem do mundo precisa de |x| >= 1.000.000, senao o localize descarta o
#      globalpos EM SILENCIO (localize_ackerman_main.cpp:3426). O no' avisa em
#      vermelho no boot se estiver abaixo disso.
#   3. O mapa 3D do SC-LIO-SAM tem que existir em SC_LIO_SAM_MAP_PATH.
#
# ORDEM DE PARTIDA (importante):
#   - suba com tudo como esta'
#   - espere o ros_bridge publicar /points_raw e as TFs
#   - encaixe o robo no mapa (2D Pose Estimate no RViz)
#   - so' entao ligue o fused_odom_slam
#   Ligar antes do encaixe publica a pose do chute inicial como se fosse verdade.
#
# DIFERENCAS EM RELACAO AO DA IARA (as tres sao porque o ARGOS nao tem GPS):
#   - origem do mundo por PARAMETRO (_origin_x/_origin_y/...) em vez de
#     _world_origin_file: nao existe map_world_origin.txt aqui, porque ele e'
#     gerado com posesOriginMode "gps". Os ORIGIN_* abaixo TEM que ser identicos ao
#     posesOrigin* do params_argos.yaml -- foi com eles que o mapa foi gerado. O no'
#     cai nos origin_* quando o arquivo nao abre (fused_odometry_from_slam_node.cpp:197-202).
#   - util_publish_dummy_gps: NAO e' localizacao. O viewer_3D descarta toda nuvem
#     enquanto nao ver um astro_gps_xyz_message (viewer_3D.cpp:910-918), entao sem
#     isso o viewer fica vazio.
#   - lidar no id 5 (e' o que esta gravado nos logs do ARGOS), nao 0.

## Path central dos dados do veiculo
SET PATH_CENTRAL=/dados/sc_lio_sam_output/lcad
## Path do mapa 2D (grade do ASTRO)
SET MAP_PATH=${PATH_CENTRAL}/map2d
SET GRAPH_PATH=${MAP_PATH}/../graphs/grafo.gr
SET ANNOTATION_PATH=${MAP_PATH}/../annotations/annotations.txt
SET PARAM_DAEMON_PATH=argos/carmen-argos.ini
SET RDDF_PATH=${MAP_PATH}/../rddf/rddf_lcad.txt
SET LIDAR_SENSOR_ID=5
SET LOG_PATH=/dados/logs_argos/log_argos_20262506_lcad_to_honofre.txt
## Mapa 3D do SC-LIO-SAM
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/lcad/
## Origem do mundo (no lugar do map_world_origin.txt da IARA -- ver cabecalho)
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0
SET PARAM_SC_LIO_SAM=argos/params_argos.yaml

# module name        group_name   requested_state  watch_heartbeats  command_line

#### servicos de suporte
 param_daemon        support       1        0      ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0      ./playback ${LOG_PATH}
 playback_control    support       1        0      ./playback_control -message 't 0.01' -speed 1.0
 proccontrol_gui     support       1        0      ./proccontrol_gui
 mss                 support       1        0      ./mss -level0 ${MAP_PATH}

#### processamento dos dados dos sensores
 fake_gps            filter        1        0      ./util_publish_dummy_gps 20.2769 40.3044 0.0
 gps_xyz             filter        1        0      ./gps_xyz
 base_ackerman       filter        1        0      ./base_ackerman

#### SLAM
# ATENCAO: -mapping_mode ON. E' isso que faz o localize virar pass-through da
# fused_odometry em vez de rodar o filtro de particulas.
 localize            SLAM          1        0      ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID} > caco_localize.txt
 mapper              SLAM          1        0      ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0      ./obstacle_distance_mapper

#### interfaces
 navigator_gui       interface     1        0      ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D           monitors      1        0      ./viewer_3D

#### ROS / SC-LIO-SAM
 ros_bridge          ros           1        0      source ../src/sc_lio_sam/devel/setup.bash && roslaunch astro_ipc_bridge astro_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true > caco_bridge.txt
 SC-LIO-SAM          ros           1        0      sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           1        0      source ../src/sc_lio_sam/devel/setup.bash && rosrun astro_ipc_bridge fused_odometry_from_slam_node _origin_x:=${ORIGIN_X} _origin_y:=${ORIGIN_Y} _origin_z:=${ORIGIN_Z} _origin_yaw:=${ORIGIN_YAW} > caco_fused.txt 2>&1

#### NAO LIGAR: publicaria astro_fused_odometry_message em paralelo com o no' acima
# fused_odometry     filter        0        0      ./fused_odometry
