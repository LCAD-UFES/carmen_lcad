## Path do mapa 2D (grade do carmen)
SET MAP_PATH=/dados/sc_lio_sam_output/lcad2/map2d

SET GRAPH_PATH=/dados/sc_lio_sam_output/lcad2/graphs/grafo.gr

SET ANNOTATION_PATH=/dados/sc_lio_sam_output/lcad2/annotations/annotations.txt

SET PARAM_DAEMON_PATH=argos/carmen-argos.ini

SET RDDF_PATH=/dados/sc_lio_sam_output/lcad2/rddf/rddf_lcad.txt

SET LIDAR_SENSOR_ID=5

SET LOG_PATH=/dados/log_argos_lcad4_20260820.txt

## Mapa 3D do SC-LIO-SAM
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/lcad2/

SET MAP_X=1000.0
SET MAP_Y=1000.0

## Origem do mundo (no lugar do map_world_origin.txt da IARA -- ver cabecalho)
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0
SET PARAM_SC_LIO_SAM=argos/params_argos.yaml

# module name        group_name   requested_state  watch_heartbeats  command_line

#### servicos de suporte
 param_daemon        support       1        0      ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0      ./playback ${LOG_PATH}
 playback_control    support       1        0      ./playback_control -message 't 0.01' -speed 1.0
 proccontrol_gui     support       1        0      ./proccontrol_gui
 map_server          support       1        0       ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on  -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 fake_gps            filter        0        0      ./util_publish_dummy_gps 20.2769 40.3044 0.0
 gps_xyz             filter        1        0      ./gps_xyz
 base_ackerman       filter        1        0      ./base_ackerman

#### SLAM
# ATENCAO: -mapping_mode ON. E' isso que faz o localize virar pass-through da
# fused_odometry em vez de rodar o filtro de particulas.
 localize            SLAM          1        0      ./localize_ackerman -mapping_mode on
 mapper              SLAM          1        0      ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0      ./obstacle_distance_mapper
 rndf_build          SLAM          0        0       ./rddf_build ${RDDF_PATH}

#### interfaces
 navigator_gui       interface     1        0      ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D           monitors      1        0      ./viewer_3D

#### ROS / SC-LIO-SAM
 carmen_ros_bridge ros 1 0 source /home/eduardopia/carmen_lcad/src/sc_lio_sam_ros2/setup.bash && exec ros2 launch carmen_ros_bridge carmen_ros_bridge.launch.py params_file:=${PARAM_SC_LIO_SAM} lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true publish_imu:=true publish_gps:=true warn_on_xsens:=true fused_odometry:=true origin_x:=${ORIGIN_X} origin_y:=${ORIGIN_Y} origin_z:=${ORIGIN_Z} origin_yaw:=${ORIGIN_YAW}
 SC-LIO-SAM          ros           1        0      sleep 1 && source /home/eduardopia/carmen_lcad/src/sc_lio_sam_ros2/setup.bash && exec ros2 launch lio_sam run.launch.py localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)

#### NAO LIGAR: publicaria carmen_fused_odometry_message em paralelo com o no' acima
# fused_odometry     filter        0        0      ./fused_odometry
