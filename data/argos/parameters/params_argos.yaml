# Launch: map_directory e localizationMode obrigatórios; gpu opcional (false).
# Mapeamento recria map_directory; localização preserva o mapa.

lio_sam:
  # Tópicos
  pointCloudTopic: "/points_raw_no_vehicle"  # Nuvem sem os pontos do veículo.
  imuTopic: "/imu_raw"
  odomTopic: "odometry/imu"
  gpsTopic: "odometry/gps"
  ackermannTopic: "/ackermann/odom_raw"  # Velocidade e esterçamento (TwistStamped).

  # Predição de odometria
  odometrySource: "imu"  # imu | ackermann | fusion
  wheelbase: 0.35  # Distância entre eixos [m].
  ackermannVelNoise: 0.2  # Fusion: sigma da velocidade [m/s].
  ackermannSteerNoise: 0.03  # Fusion: sigma do esterçamento [rad].
  ackermannSlipNoiseX: 0.05  # Fusion: slip longitudinal [m/√s].
  ackermannSlipNoiseY: 0.05  # Fusion: slip lateral [m/√s].
  ackermannSlipNoiseTheta: 0.02  # Fusion: slip angular [rad/√s].
  ackermannYawLockKeyframes: 0  # Ackermann: keyframes mínimos para liberar a rotação; 0 = só mapa não vazio.

  # Frames
  lidarFrame: "velodyne"
  baselinkFrame: "base_link"
  odometryFrame: "odom"
  mapFrame: "map"

  # GPS e orientação inicial
  useImuHeadingInitialization: false  # Inicializa o yaw pelo IMU.
  useGpsElevation: false  # Usa a altitude do GPS.
  gpsCovThreshold: 2.0  # Covariância máxima do GPS [m²].
  poseCovThreshold: 25.0  # Limiar de covariância da pose para usar GPS [m²].

  # Localização pose inicial de base_link no mapa [m, rad]
  localizationMode: true  # Ignorado pelos launches ROS 2; passe via linha de comando.
  initialPoseX: 0.0
  initialPoseY: 0.0
  initialPoseZ: 0.0
  initialPoseRoll: 0.0
  initialPosePitch: 0.0
  initialPoseYaw: 0.0

  # poses_opt.dat grava após o encaixe no mapa, em localização
  posesEnable: true
  posesOutputFile: "/dados/sc_lio_sam_output/poses_opt.dat"
  posesStartTime: 0.0  # Timestamp ROS mínimo [s]; 0 desativa o corte.
  posesSettleScans: 20  # Scans descartados após cada encaixe.
  posesInterpolateMaxError: 0.10  # Erro máximo da interpolação [m].
  posesInterpolateMaxGap: 5.0  # Intervalo máximo [s]; 0 desativa a interpolação.
  posesCarmenStampTopic: "/carmen/scan_time_reference"  # Sem timestamp CARMEN correspondente, a pose é descartada.
  # Argos sem Ackermann use graphslam_publish -poses_from lidar.
  posesAckermannTopic: "/ackermann/odom_raw"  # Preenche odometry_ts; sem mensagem, usa -1.

  # Origem:x=northing, y=-easting [m]; yaw relativo [rad]
  posesOriginMode: "manual"  # manual | gps; manual usa posesOrigin*.
  # Origem manual manter |x| >= 1000000 para publicar globalpos.
  posesOriginX: 7757339.037
  posesOriginY: -363784.117
  posesOriginZ: 0.0
  posesOriginYaw: 0.0
  posesOriginLock: true  # GPS: impede atualizar a origem.
  posesOriginRefine: false  # GPS: continua refinando a origem.
  posesOriginMinSamples: 20  # GPS: amostras mínimas.
  posesOriginMaxDt: 0.50  # GPS: intervalo máximo entre scans [s].
  posesOriginMinBaseline: 1.0  # GPS: deslocamento mínimo para estimar o rumo [m].
  posesOriginRelPosNoise: 0.25  # GPS: variância relativa da posição [m²].

  # LiDAR
  N_SCAN: 32  # Número de linhas.
  Horizon_SCAN: 2000  # Colunas por volta.
  downsampleRate: 1  # Passo entre linhas; 1 usa todas.
  lidarMaxRange: 70.0  # m

  # IMU
  imuAccNoise: 0.059653  # Ruído do acelerômetro [m/s²/√Hz].
  imuGyrNoise: 0.010597  # Ruído do giroscópio [rad/s/√Hz].
  imuAccBiasN: 0.0002  # Random walk do bias do acelerômetro.
  imuGyrBiasN: 0.0002  # Random walk do bias do giroscópio.
  imuGravity: 9.574869  # m/s²
  imuRPYWeight: 0.3  # Peso do IMU em roll/pitch [0–1].

  # Extrínseca IMU → LiDAR
  extrinsicTrans: [0.0, 0.0, 0.19]  # x, y, z [m]
  extrinsicRPY: [0.0, 0.0, 0.0]  # roll, pitch, yaw [rad]

  # Features LOAM
  edgeThreshold: 1.0
  surfThreshold: 0.1
  edgeFeatureMinValidNum: 10
  surfFeatureMinValidNum: 100

  # Filtros voxel [m]
  odometrySurfLeafSize: 0.1
  mappingCornerLeafSize: 0.05
  mappingSurfLeafSize: 0.1

  # Restrições de movimento
  z_tollerance: 1000  # Limite de altura [m].
  rotation_tollerance: 1000  # Limite de roll/pitch [rad].

  # Processamento
  numberOfCores: 8
  mappingProcessInterval: 0.015  # Intervalo mínimo entre scans processados [s].
  slamQueueSize: 1  # Fila de scans; menor favorece tempo real.

  # Mapa local
  surroundingkeyframeAddingDistThreshold: 0.1  # Distância mínima entre keyframes [m].
  surroundingkeyframeAddingAngleThreshold: 0.1  # Rotação mínima entre keyframes [rad].
  surroundingKeyframeDensity: 1.0  # Voxel dos keyframes vizinhos [m].
  surroundingKeyframeSearchRadius: 70.0  # Raio de busca [m].

  # Loop closure
  loopClosureEnableFlag: true
  loopClosureFrequency: 1.0  # Hz
  historyKeyframeSearchRadius: 15.0  # Raio de busca [m].
  historyKeyframeSearchTimeDiff: 60.0  # Separação temporal mínima [s].
  historyKeyframeSearchNum: 10  # Keyframes agregados no candidato.
  historyKeyframeFitnessScore: 0.3  # Score ICP máximo; menor é mais restritivo.

  # Visualização
  globalMapVisualizationSearchRadius: 1000.0  # Raio [m].
  globalMapVisualizationPoseDensity: 10.0  # Espaçamento entre poses [m].
  globalMapVisualizationLeafSize: 0.01  # Voxel [m].

carmen_ros_bridge:

  # Colisão alturas e margem dos cilindros [m]
  robot_collision_height: 0.70
  semi_trailer_collision_height: 0.70
  collision_safety_margin: 0.10
