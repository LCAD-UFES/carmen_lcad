# Localização no mapa 3D durante playback, com globalpos publicado no CARMEN.
# O mapa 2D é usado em modo de leitura e poses_opt.dat é preservado.

SET LOG_NAME=log_argos_mapa_ufes-1.txt
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/EE2/
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d

SET PARAM_FILE=../data/argos/parameters/carmen-argos.ini
SET PARAM_SC_LIO_SAM=../data/argos/parameters/params_argos.yaml
SET LIDAR_SENSOR_ID=5

SET MAP_X=7757339
SET MAP_Y=-363784

# Mesma origem manual de posesOrigin* no YAML.
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### Servicos de suporte
 param_daemon         support       1                  0                   ./param_daemon ${PARAM_FILE}
 proc_control         support       1                  0                   ./proccontrol_gui
 playback             support       1                  0                   ./playback /dados/${LOG_NAME}
 playback_control     support       1                  0                   ./playback_control -message 't 0.0 '
 map_server           support       1                  0                   ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### Dados dos sensores
 base_ackerman        filter        1                  0                   ./base_ackerman

#### SLAM
# Converte fused_odometry da ponte ROS em globalpos; não executa filtro de partículas.
 localize             SLAM          1                  0                   ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID} > caco_localize.txt
 mapper               SLAM          1                  0                   ./mapper -map_path ${MAP_PATH} -mapping_mode off
 od_mapper            SLAM          1                  0                   ./obstacle_distance_mapper

#### Interfaces
 navigator_gui        interface     1                  0                   ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D            interface     0                  0                   ./viewer_3D

#### SC-LIO-SAM
# Se necessário, indique a posição inicial com 2D Pose Estimate no RViz.
 SC-LIO-SAM           ros           1                  0                   sleep 1 && source ../src/sc_lio_sam/setup.bash && exec ros2 launch lio_sam run.launch.py localizationMode:=true posesEnable:=false params_file:=${PARAM_SC_LIO_SAM} map_directory:=${SC_LIO_SAM_MAP_PATH} > caco_sclio.txt
 carmen_ros_bridge    ros           1                  0                   source ../src/sc_lio_sam/setup.bash && exec ros2 launch carmen_ros_bridge carmen_ros_bridge.launch.py lidar_sensor_id:=${LIDAR_SENSOR_ID} params_file:=${PARAM_SC_LIO_SAM} fused_odometry:=true origin_x:=${ORIGIN_X} origin_y:=${ORIGIN_Y} origin_z:=${ORIGIN_Z} origin_yaw:=${ORIGIN_YAW}
