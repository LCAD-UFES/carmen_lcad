## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos

# ARGOS (Unitree Go2) com globalpos vindo do SC-LIO-SAM
#
# Derivado do process-iara-sc-globalpos.ini. Mesma cadeia de localizacao:
#
#   SC-LIO-SAM --/odometry/imu--> fused_odometry_from_slam_node
#              --astro_fused_odometry_message--> localize_ackerman -mapping_mode on
#              --astro_localize_ackerman_globalpos--> mapper, planners, ...
#
# Em -mapping_mode on o localize NAO roda o filtro de particulas: monta o globalpos
# so' a partir da fused_odometry (localize_ackerman_main.cpp:3665 ->
# publish_globalpos_on_mapping_mode).
#
# ================== LEIA ANTES DE RODAR ==================
#
# Isto e' um TESTE, nao o caminho de producao. Riscos herdados do process da IARA:
#
#  1. SEM filtro de particulas. Se o SC-LIO-SAM perder o encaixe, NAO HA NADA
#     segurando a pose.
#  2. SEM redundancia de GPS -- e no ARGOS nao ha GPS nenhum.
#  3. Se o no' ROS morrer, o globalpos PARA. Sem fallback.
#
# Por isso os planners sobem DESLIGADOS.
#
# DIFERENCAS EM RELACAO AO PROCESS DA IARA:
#  - driver do robo: roda DENTRO do Go2, atras do ojArgos de la' (ver JAUS
#    DISTRIBUIDO abaixo). Aqui no PC ficam so' o ojNodeManager (como CCU) e o
#    ford_escape_hybrid, que continua rodando o PID e publicando o IPC.
#  - IMU: xsens_argos (IMU nativa do Go2 via DDS), no lugar do imu_can_driver
#  - lidar no id 5 (e' o que esta' gravado nos logs e nos parametros lidar5_*)
#  - sem GPS: o util_publish_dummy_gps existe SO' para destravar o desenho do lidar
#    no viewer_3D (ele descarta toda nuvem enquanto nao ver um astro_gps_xyz_message
#    -- viewer_3D.cpp:910-918 e :4444). NAO e' localizacao.
#
# ================== JAUS DISTRIBUIDO (PC <-> Go2) ==================
#
# Neste modo o ojArgos e o driver da Unitree rodam DENTRO do Go2
# (ssh unitree@192.168.123.18). Aqui no PC roda so' o node manager no papel de CCU.
# Por isso, neste arquivo, 'car_driver' (ojArgos local) e 'argos_driver'
# (argos_unitree_driver local) sobem DESLIGADOS -- ver os comentarios neles.
#
#   PC   192.168.123.99  ojNodeManager subsystem 4  +  ford_escape_hybrid
#   Go2  192.168.123.18  ojNodeManager subsystem 1  +  ojArgos  +  driver
#
# O subsystem TEM que ser diferente nos dois lados: o ford_escape_hybrid endereca
# 1.1.x fixo (ojTorc/src/torcComm.c:57) e o JausSubsystemCommunicationManager
# DESCARTA (nao poe na rede) mensagem cujo destino e' o proprio subsystem
# (JausSubsystemCommunicationManager.cpp:184). Dai o nodeManager_Argos_CCU.conf.
#
# PRE-REQUISITO DE REDE 1 -- rota de multicast (uma vez so', fica gravada na conexao):
#     sudo nmcli connection modify Prometheus +ipv4.routes "224.1.0.1/32"
#     sudo nmcli connection up Prometheus
# ('Prometheus' e' a conexao da enp130s0 -- confira com: nmcli connection show --active)
#
# Sem essa rota o ojNodeManager entra no grupo multicast do JAUS pela placa Wi-Fi e
# nunca ouve o robo: o IP_ADD_MEMBERSHIP vai com imr_interface 0.0.0.0
# (libopenJaus/src/utils/multicastSocket.c:170, porque o getsockname sobrescreve o IP
# do .conf na linha 116), e com 0.0.0.0 quem escolhe a placa e' a rota default -- que
# aqui e' o Wi-Fi (metrica 600 contra 20100 da enp130s0). O JUDP_IP_Address do .conf
# so' vale para o IP_MULTICAST_IF (por onde SAI), nao para o que ENTRA.
# Equivalente volatil, se nao quiser persistir: sudo ip route add 224.1.0.1/32 dev enp130s0
# Conferir depois de subir o jaus:
#     awk '/^[0-9]/{d=$2} /010001E0/{print d}' /proc/net/igmp    # tem que dizer enp130s0
#
# PRE-REQUISITO DE REDE 2 -- ordem dos IPs da enp130s0: 192.168.123.99 TEM que ser o
# PRIMARIO (nmcli -g ipv4.addresses connection show Prometheus). O CycloneDDS do
# unitree_sdk2 recebe so' o NOME da placa (xsens_argos_main.cpp:285) e anuncia o
# endereco primario dela; com 192.168.0.99 na frente, o Go2 nao consegue responder e
# nao chega LowState nenhum -- e sem IMU o imageProjection do LIO-SAM descarta TODA
# nuvem e o mapOptmization fica em "aguardando o primeiro scan", mesmo com a nuvem
# aparecendo certinha no viewer_3D. Sintoma no caco_xsens.txt:
#     xsens_argos: ainda sem LowState do robo em 'rt/lowstate' (interface 'enp130s0').
# O 'Error: Cannot bind multicast socket to 0.0.0.0:3794' no caco_jaus.txt e' ruido
# conhecido (printf de debug antes do bind, multicastSocket.c:192) -- ignore.
#
# ===================================================================
#
# ORDEM DE PARTIDA:
#   0. a rota de multicast acima, e o lado do Go2 no ar (ojNodeManager + ojArgos)
#   1. sobe o process (sensores, bridge, localize, mapper)
#   1b. confere no caco_ford.txt que o ford_escape achou o robo (sem 'Error creating
#       XGV_CCU'); no console do jaus, a tecla 't' tem que listar OJSubsystem-1
#   2. liga o SC-LIO-SAM e ENCAIXA o robo no mapa (2D Pose Estimate no RViz)
#   3. confere no RViz que a nuvem cola no mapa 3D
#   4. liga o fused_odom_slam
#   5. confere no navigator_gui2 que o robo esta' no lugar certo e andando junto
#   6. so' entao os planners
#
# =========================================================

## Interface de rede pela qual se enxerga o Go2 (o cabo). Confira com `ip addr`.
SET NETWORK_INTERFACE=enp130s0

## CAN virtual por onde o argos_unitree_driver e o ojArgos LOCAIS conversariam.
## No modo JAUS distribuido os dois estao desligados e a vcan0 nao e' usada -- isto
## fica aqui so' para quando voltar a rodar tudo no PC. Nesse caso, ANTES de subir:
##     sudo modprobe vcan
##     sudo ip link add dev vcan0 type vcan
##     sudo ip link set up vcan0
## Sem ela o argos_unitree_driver sai na hora dizendo qual comando falta.
## Para ver o trafego: candump vcan0
SET ODOM_CAN_BUS=vcan0
SET COMMAND_CAN_BUS=vcan0

## Mapa 2D (grade do ASTRO) gerado pelo process-argos-map_generation.ini
SET MAP_PATH=/dados/sc_lio_sam_output/EE/map2d
SET MAP_PATH_L1=/dados/sc_lio_sam_output/EE/map2d_l1

## Mapa 3D do SC-LIO-SAM
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/EE/
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/params_argos.yaml
# O diretorio e' map2d/graphs, nao lcad/graphs: o mapeditor2 grava o .gr em
# dirname(dirname(rddf))/graphs (mapeditor2.py:1478) e o RDDF fica em map2d/rddf/.
SET GRAPH=/dados/sc_lio_sam_output/EE/graphs/graph-rddf_2026-08-17-16-25-31-2.gr

## Lidar: o ARGOS usa o id 5 (bloco lidar5_* no carmen-argos.ini)
SET LIDAR_SENSOR_ID=5

## Origem do mundo. TEM QUE SER IDENTICA ao posesOrigin* do params_argos.yaml --
## foi com ela que o mapa foi gerado. Se divergir, o mapa e a pose caem em lugares
## diferentes. Nao ha map_world_origin.txt aqui (a origem e' manual, o ARGOS nao tem
## GPS), entao passamos por parametro: o no' cai nos origin_* quando o arquivo nao
## abre (fused_odometry_from_slam_node.cpp:197-202).
## ATENCAO: |origin_x| < 1.000.000 faz o localize_ackerman descartar o globalpos EM
## SILENCIO (localize_ackerman_main.cpp:3428).
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0

## Chute inicial dentro do mapa 3D (o 2D Pose Estimate do RViz sobrescreve)
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PATH_CENTRAL}/parameters/carmen-argos.ini
 proccontrol_gui     support       1        0          ./proccontrol_gui
 mss                 support       1        0          ./map_server -map_path ${MAP_PATH} -block_map on
 logger              support       0        0          bash -c './logger /dados/logs_argos/log_argos-$(date +%Y-%m-%d_%H-%M-%S).txt'
 jaus                support       1        0          ../sharedlib/OpenJAUS/ojNodeManager/bin/ojNodeManager ../sharedlib/OpenJAUS/ojNodeManager/nodeManager_Argos_CCU.conf a > caco_jaus.txt 2>&1
 car_driver          support       0        0          ../sharedlib/OpenJAUS/ojArgos/bin/ojArgos ${ODOM_CAN_BUS} ${COMMAND_CAN_BUS} > caco_ojargos.txt 2>&1

#### Robo
 ford_escape         robot         1        0          ./ford_escape_hybrid -robot_model_name 3 -tune_pid_mode on > caco_ford.txt 2>&1
 argos_driver        robot         0        0          ./argos_unitree_driver -network_interface ${NETWORK_INTERFACE} -can_interface ${COMMAND_CAN_BUS} > caco_argos_driver.txt 2>&1
 base_ackerman       robot         1        0          ./base_ackerman

#### sensores
 hesai               sensors       1        0          ./hesai_driver -lidar_id ${LIDAR_SENSOR_ID}
 imu                 sensors       1        0          ./xsens_argos -network_interface ${NETWORK_INTERFACE} > caco_xsens.txt
 camera1             sensors       1        0          ./argos_unitree_camera -network_interface ${NETWORK_INTERFACE} -camera_id 1 > caco_camera.txt

#### processamento dos dados dos sensores
# So' para destravar o desenho do lidar no viewer_3D -- ver o cabecalho.
 fake_gps            filter        1        0          ./util_publish_dummy_gps 20.2769 40.3044 0.0
 gps_xyz             filter        1        0          ./gps_xyz

#### SLAM
 localize_slam       loc_slam      1        0          ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID}
 localize_normal     loc_normal    0        0          ./localize_ackerman -mapping_mode off -lidar ${LIDAR_SENSOR_ID}
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper
 rndf_build          SLAM          0        0          ./rddf_build ${MAP_PATH}/../rddf/rddf.txt

#### ROS / SC-LIO-SAM  (use_sim_time OFF -- sensor ao vivo, nao playback)
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=false > caco_bridge.txt
 SC-LIO-SAM          ros           1        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true rviz:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=false > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _origin_x:=${ORIGIN_X} _origin_y:=${ORIGIN_Y} _origin_z:=${ORIGIN_Z} _origin_yaw:=${ORIGIN_YAW} > caco_fused.txt 2>&1

#### hierarquia de controle -- LIGAR SO' DEPOIS DE VALIDAR A POSE
 route_planner       planner       1        0          ./route_planner --graph ${GRAPH} ${SC_LIO_SAM_MAP_PATH}/annotations.txt
 offroad_planner     planner       1        0          ./offroad_planner
 behavior_select     planner       1        0          ./behavior_selector
 MPP                 planner       1        0          ./model_predictive_planner
 obstacle_avoider    planner       1        0          ./obstacle_avoider

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH} -annotation_path ${SC_LIO_SAM_MAP_PATH}annotations.txt
 viewer_3D           monitors      0        0          ./viewer_3D
 Cam_view            monitors      0        0          ./camera_viewer unitree1 1

#### NAO LIGAR: publicaria astro_fused_odometry_message em paralelo com o no' acima
# fused_odometry     filter        0        0          ./fused_odometry
