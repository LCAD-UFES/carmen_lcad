# ARGOS real: MAPEAMENTO 2D so' com a odometria 6D do Go2 (sem SC-LIO-SAM, sem ROS).
#
# Cadeia: Go2 (rt/utlidar/robot_odom) -> odometry_6d_go2 -fused_odometry on (pose = 10000,10000 +
# velocidades do Go2 integradas) -> localize_ackerman -mapping_mode on (repassa como globalpos) -> mapper
# -mapping_mode on grava os blocos m*.map em ${MAP_FILES_PATH}.
#
# Antes, uma vez por boot do ARGOS (sudo):
#     sudo modprobe vcan
#     bash ~/carmen_lcad/bin/argos/init_vcan_argos.bat
# Rodar a partir de bin/ (com o central ja' no ar):
#     ./proccontrol ../data/argos/process/process-argos-mapear-odom6d.ini
# No notebook (Wi-Fi 4Argos):
#     ~/carmen_lcad/bin/carmen_app --host 10.42.0.61
#
# Ande com o robo pelo controle; o mapa aparece no app (Opcoes > Map (mapper)). Ao terminar, de'
# Ctrl+C no proccontrol: o mapper ja' gravou os blocos. "Pose inicial" no app reancora a pose.
# Sem "sleep" e com "exec" nas linhas com redirecionamento (senao sobram modulos orfaos).

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos
SET PARAM_FILE=${PATH_CENTRAL}/parameters/carmen-argos.ini

SET NETWORK_INTERFACE=eth0
SET ODOM_CAN_BUS=vcan0
SET COMMAND_CAN_BUS=vcan0
SET LIDAR_SENSOR_ID=5

# Onde o mapa novo e' gravado (criada se nao existir)
SET MAP_FILES_PATH=/dados/mapa_argos_odom6d

# Pose inicial do mapa (referencial local, longe de 0 por causa do x_origin == 0.0 do carmen)
SET INITIAL_X=10000.0
SET INITIAL_Y=10000.0
SET INITIAL_THETA=0.0

SET LOG_PATH=log_argos_mapear_odom6d.txt

# module name        group_name    requested_state  watch_heartbeats  command_line

#### Servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_FILE}
 proc_control        support       1        0          ./carmen_server -app_watchdog 5 -map_path ${MAP_FILES_PATH}
 jaus                support       1        0          exec ../sharedlib/OpenJAUS/ojNodeManager/bin/ojNodeManager ../sharedlib/OpenJAUS/ojNodeManager/nodeManager_Argos.conf a >> caco_jaus.txt 2>&1
 car_driver          support       1        0          ../sharedlib/OpenJAUS/ojArgos/bin/ojArgos ${ODOM_CAN_BUS} ${COMMAND_CAN_BUS}
 map_server          support       1        0          mkdir -p ${MAP_FILES_PATH}; exec ./map_server -map_path ${MAP_FILES_PATH} -map_x ${INITIAL_X} -map_y ${INITIAL_Y} -block_map on -lanemap_incoming_message_type 0
 joystick            support       0        0          ./joystick_vehicle -direct_v_and_phi_mode on

#### Robo
 unitree_driver      robot         1        0          exec ./argos_unitree_driver -network_interface ${NETWORK_INTERFACE} -can_interface ${COMMAND_CAN_BUS} -verbose on >> argos_unitree_driver.txt 2>&1
 ford_escape         robot         1        0          exec ./ford_escape_hybrid -robot_model_name 4 -tune_pid_mode on > results_pid.txt
 base_ackerman       robot         1        0          ./base_ackerman

#### Sensores (IMU no xsens_argos_go2; odometria 6D e a fused_odometry ancorada no odometry_6d_go2)
 XSENS               sensors       1        0          ./xsens_argos_go2 -network_interface ${NETWORK_INTERFACE}
 ODOM_6D             sensors       1        0          ./odometry_6d_go2 -network_interface ${NETWORK_INTERFACE} -fused_odometry on -initial_x ${INITIAL_X} -initial_y ${INITIAL_Y} -initial_theta ${INITIAL_THETA}
 HESAI_32            sensors       1        0          ./hesai_driver -lidar_id ${LIDAR_SENSOR_ID}
 gps_xyz             sensors       1        0          ./gps_xyz

#### Mapeamento
 localize            SLAM          1        0          exec ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID} >> caco_localize.txt 2>&1
 mapper              SLAM          1        0          mkdir -p ${MAP_FILES_PATH}; exec ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on
 od_mapper           SLAM          0        0          ./obstacle_distance_mapper

#### Utilitarios
 init_pose           init_pose     1        0          ./util_publish_initial_pose ${INITIAL_X}, ${INITIAL_Y}, ${INITIAL_THETA}, 4, 0.0
 LOG_CREATE          utils         0        0          ./logger /dados/${LOG_PATH}
