## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos

# ARGOS -- playback com globalpos vindo do poses_opt.dat (SEM localize_ackerman)
#
# Para usar ENQUANTO o mapa esta sendo editado no mapeditor2: o robo anda pela
# trajetoria JA GRAVADA, entao nada depende de a localizacao fechar contra um mapa
# que esta mudando debaixo do pe.
#
#   playback --scan do lidar 5--> graphslam_publish (casa timestamp com o
#            poses_opt.dat) --astro_localize_ackerman_globalpos--> mapper,
#            navigator_gui2, viewer_3D
#
# DIFERENCA PARA O process-argos-map_generation.ini: la o mapper roda com
# -mapping_mode ON e GRAVA os blocos em disco. Aqui ele roda com -mapping_mode OFF:
# le o mapa offline e funde o sensor online so' em memoria, sem escrever nada. E'
# isso que torna seguro rodar isto com o mapeditor2 aberto no mesmo mapa.
#
# ================== LEIA ANTES DE RODAR ==================
#
#  1. O robo NAO obedece comando nenhum -- ele repete o log. Os planners sobem
#     desligados de proposito: com globalpos vindo de arquivo, eles comandariam um
#     veiculo que nao existe. Para dirigir de verdade use o
#     process-argos-simulate.ini (simulador) ou o robo real.
#
#  2. O `mss` carrega os blocos do mapa na inicializacao. Se voce salvar o mapa no
#     mapeditor2 com este process no ar, REINICIE o mss (pelo proccontrol_gui) para
#     ver a alteracao -- ele nao rele o disco sozinho.
#
#  3. LIDAR 5. O log foi gravado com o lidar no id 5 e o
#     carmen-argos.ini esta configurado para o 5 (mapper_lidar5 on). Nao mexa nisso
#     aqui -- o simulador e' que precisa do 0, ver process-argos-simulate.ini.
#
#  4. -poses_from lidar e' obrigatorio. As colunas de odometry_ts e gps_ts do
#     poses_opt.dat vem -1 no ARGOS (sem GPS, sem odometria ackermann), e o
#     graphslam_publish descarta candidato com timestamp <= 0 -- com `odometry` ou
#     `gps` ele nao publica NADA, calado. O default, se a flag faltar, e' `gps`.
#
# =========================================================

SET LOG_PATH=/dados/logs_argos/log_argos-2026-08-14_15-15-39.txt
SET PARAM_PATH=${PATH_CENTRAL}/parameters/carmen-argos.ini

SET POSES_PATH=/dados/sc_lio_sam_output/poses_opt.dat
SET MAP_FILES_PATH=/dados/sc_lio_sam_output/EE/map2d
SET MAP_FILES_PATH_L1=/dados/sc_lio_sam_output/EE/map2d_l1

## Mapa 3D do SC-LIO-SAM
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/EE/
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/params_argos.yaml

## Lidar: o ARGOS usa o id 5 (bloco lidar5_* no carmen-argos.ini)
SET LIDAR_SENSOR_ID=5

## Origem do mundo. TEM QUE SER IDENTICA ao posesOrigin* do params_argos.yaml --
## foi com ela que o mapa foi gerado. Se divergir, o mapa e a pose caem em lugares
## diferentes. Nao ha map_world_origin.txt aqui (a origem e' manual, o ARGOS nao tem
## GPS), entao passamos por parametro: o no' cai nos origin_* quando o arquivo nao
## abre (fused_odometry_from_slam_node.cpp:197-202).
## ATENCAO: |origin_x| < 1.000.000 faz o localize_ackerman descartar o globalpos EM
## SILENCIO (localize_ackerman_main.cpp:3428).
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0

## Chute inicial dentro do mapa 3D (o 2D Pose Estimate do RViz sobrescreve)
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0


# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_PATH}
 proccontrol_gui     support       1        0          ./proccontrol_gui
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message "t 0"
 mss                 support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -block_map on #-level1 ${MAP_FILES_PATH_L1}

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### localizacao: o poses_opt.dat NO LUGAR do localize_ackerman
#
# Nao subir o localize_ackerman junto: os dois publicariam
# astro_localize_ackerman_globalpos em paralelo e a pose ficaria pulando entre as
# duas fontes.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID} > caco_localize.txt
 rndf_build          SLAM          0        0          ./rddf_build ${MAP_FILES_PATH}/rddf/rddf.txt

#### mapa (SO' LEITURA -- mapping_mode off, nao grava bloco nenhum)
 mapper_0            SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode off
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH} -annotation_path ${SC_LIO_SAM_MAP_PATH}/annotations.txt
 viewer_3D           interface     0        0          ./viewer_3D

#### ROS / SC-LIO-SAM  (use_sim_time OFF -- aqui e' sensor ao vivo, nao playback)
#### ROS / SC-LIO-SAM  (use_sim_time OFF -- sensor ao vivo, nao playback)
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=false > caco_bridge.txt
 SC-LIO-SAM          ros           1        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=false > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _origin_x:=${ORIGIN_X} _origin_y:=${ORIGIN_Y} _origin_z:=${ORIGIN_Z} _origin_yaw:=${ORIGIN_YAW} > caco_fused.txt 2>&1
