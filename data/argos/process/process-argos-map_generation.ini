## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos

#SET LOG_PATH=/dados/logs_argos/log_argos_EE_20260817-1.txt
SET LOG_PATH=/dados/logs_argos/log_argos_mapa_ufes-1.txt

SET PARAM_PATH=${PATH_CENTRAL}/parameters/carmen-argos.ini

SET MAP_X=7757339
SET MAP_Y=-363784

SET POSES_PATH=/dados/sc_lio_sam_output/poses_opt2.dat
SET MAP_FILES_PATH=/dados/sc_lio_sam_output/ufes_argos/map2d

## O LiDAR do ARGOS e' o 5, nao o 0: o log traz VELODYNE_VARIABLE_SCAN_IN_FILE5,
## e o carmen-argos.ini tem localize_ackerman_lidar5 on (Pandar XT-32).
## Com 0 aqui, o graphslam_publish_globalpos assina um variable_scan que nunca
## chega -- e ele so' publica globalpos casada com scan, entao nao publica NADA:
## o mapper fica sem pose e o mapa nao sai. Sem erro, sem aviso.
SET LIDAR_SENSOR_ID=5


# module name         group_name    requested_state    watch_heartbeats    command_line
#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message "t 0"
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on  -lanemap_incoming_message_type 0
# SEM EQUIVALENTE NO CARMEN: obstacle_evidence nao existe no carmen
#oe0                 support       0        0          ./obstacle_evidence 0
 
#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman
# localize DESLIGADO: o graphslam_publish_globalpos abaixo ja' publica a globalpos
# direto do poses_opt.dat. Os dois ligados sao DOIS publicadores da mesma mensagem,
# e o mapper passa a receber pose de duas fontes intercaladas.
# Alem disso, o localize em -mapping_mode on so' repassa a fused_odometry, e neste
# process nao ha' ninguem publicando fused_odometry -- ele ficaria mudo de qualquer jeito.
 localize            filter        0        0          ./localize_ackerman -mapping_mode on

#### SLAM
 mapper_0            SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D
 Camera1             monitors      0        0          ./camera_viewer 1

#### graphSLAM
 pub_poses           graphslam     1        0          ./graphslam_publish_globalpos ${POSES_PATH} -poses_from lidar -lidar_id ${LIDAR_SENSOR_ID}
 complete_map        graphslam     0        0          ./build_complete_map -map_path ${MAP_FILES_PATH}; echo "Programa concluido normalmente"; sleep 30m
