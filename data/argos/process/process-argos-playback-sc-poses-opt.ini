# Gera poses_opt.dat localizando no mapa 3D existente.
# No YAML: posesEnable=true e posesOutputFile define o arquivo de saída.

SET LOG_NAME=log_argos_mapa_ufes-1.txt
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/EE2/

SET PARAM_FILE=../data/argos/parameters/carmen-argos.ini
SET PARAM_SC_LIO_SAM=../data/argos/parameters/params_argos.yaml
SET LIDAR_SENSOR_ID=5

# module name         group_name    requested_state    watch_heartbeats    command_line

#### Servicos de suporte
 param_daemon         support       1                  0                   ./param_daemon ${PARAM_FILE}
 proc_control         support       1                  0                   ./proccontrol_gui
 playback             support       1                  0                   ./playback /dados/${LOG_NAME}
 playback_control     support       1                  0                   ./playback_control -message 't 0.0 '

#### Interfaces
 viewer_3D            interface     1                  0                   ./viewer_3D

#### SC-LIO-SAM
# Após o encaixe no mapa, as poses são gravadas pelo próprio SC-LIO-SAM.
 SC-LIO-SAM           ros           1                  0                   sleep 1 && source ../src/sc_lio_sam/setup.bash && exec ros2 launch lio_sam run.launch.py localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} map_directory:=${SC_LIO_SAM_MAP_PATH} > caco_sclio.txt
 carmen_ros_bridge    ros           1                  0                   source ../src/sc_lio_sam/setup.bash && exec ros2 launch carmen_ros_bridge carmen_ros_bridge.launch.py lidar_sensor_id:=${LIDAR_SENSOR_ID} params_file:=${PARAM_SC_LIO_SAM}
