# Exemplo de entrada de proccontrol:
# module name            group_name    requested_state        watch_heartbeats    command_line

#### Serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_FILE}
 proc_control        support       1        0          ./proccontrol_gui
 playback            support       1        0          ./playback /dados/${LOG_NAME}
 playback_control    support       1        0          ./playback_control -message 't 0.0 '

 map_server          support       0        0          ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on  -lanemap_incoming_message_type 0
 base_ackerman       robot         0        0          ./base_ackerman
 fused_odometry      SLAM          0        0          ./fused_odometry -use_gps off -force_initial_pose on -initial_x ${START_X} -initial_y ${START_Y} -initial_theta ${START_THETA}

#### SLAM
 fused_odometry      SLAM          0        0          ./fused_odometry -use_gps off -force_initial_pose on -initial_x ${START_X} -initial_y ${START_Y} -initial_theta ${START_THETA}
 mapper              SLAM          0        0          ./mapper -map_path ${MAP_PATH}
 
#### Interfaces
 viewer_3D           interface     1        0          ./viewer_3D
 Cam_view            interface     0        0          ./camera_viewer unitree1 1
 Cam_view_lat        interface     0        0          ./camera_viewer 4

#### SC-LIO-SAM
# gpu:=true -- busca de mapa (kNN corner/surf + downsample) na GPU via CUDA.
# Tira do caminho critico os ~30% de kdtree/FLANN que rodam DENTRO do
# laserCloudInfoHandler. Isso importa aqui porque o mapOptmization roda em
# ros::spin() single-thread: enquanto o ICP mastiga o mapa, o callback do
# /carmen/scan_time_reference nao roda, a fila estoura, e todo scan sem
# timestamp CARMEN casado tem a pose DESCARTADA (poses_opt.dat vazio).
# Medido a 1.0x sem GPU: 516 scans descartados. A 0.3x o problema some.
# Exige toolkit CUDA >= 12.8 instalado; sem ele o build cai no stub e este
# argumento nao faz nada -- confira 'CUDA ... found' no catkin_make.
 SC-LIO-SAM          ros           1        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch gpu:=true localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} > caco.txt
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch
 
 
