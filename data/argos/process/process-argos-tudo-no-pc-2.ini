## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos

### Roda o ARGOS inteiro a partir DESTE PC. Nenhum modulo precisa subir no robo.
### Antes de abrir, uma vez por boot (precisa de sudo):
#     sudo modprobe vcan
#     ./${PATH_CENTRAL}/init_vcan_argos.bat
###
### Cadeia: planner -> ford_escape_hybrid (PID) -> ojArgos -> CAN 0x100 -> argos_unitree_driver
###         -> Go2 (SportClient::Move); volta por DDS rt/sportmodestate -> CAN 0x425 + 0x80
###         -> ojArgos -> ford_escape_hybrid -> carmen_robot_ackerman_odometry -> base_ackerman

# Interface de rede do cabo do robo (o Go2 responde em 192.168.123.161)
SET NETWORK_INTERFACE=enp130s0

# IP DESTE PC na rede do lidar (o lidar5_host_ip do .ini e' o IP que o robo usava)
SET LIDAR_HOST_IP=192.168.1.99

# Raspberry Pi 5 + Hailo-8L da deteccao de pessoas (pi_nit)
SET PI_NIT_HOST=192.168.1.20
SET NIT_CAMERA=1

# Parametros de comunicacao
SET ODOM_CAN_BUS=vcan0
SET COMMAND_CAN_BUS=vcan0

# Mapa da UFES gerado de log_argos_mapa_ufes-1. Trocar de mapa = trocar SO' esta linha.
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/ufes_argos/
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d
SET GRAPH_PATH=${SC_LIO_SAM_MAP_PATH}graphs/graph-rddf_ufes.gr
## as anotacoes ficaram DENTRO do map2d neste mapa, nao como irmas dele
SET ANNOTATION_PATH=${MAP_PATH}/annotations/annotations.txt
SET RDDF_PATH=${SC_LIO_SAM_MAP_PATH}rddf/rddf_ufes.txt

SET LOG_PATH=log_loop_ct13.txt

SET LIDAR_SENSOR_ID=5

# Origem do mapa: primeira pose do poses_opt.dat que gerou a grade
SET MAP_X=7757339
SET MAP_Y=-363784

# Posicao inicial do Robo -- anotacao RDDF_PLACE_LCAD
SET INITIAL_X=7757339.527777
SET INITIAL_Y=-363784.042662
SET INITIAL_THETA=-0.079830
SET ORIGIN_THETA=0.0

# Objetivo final -- anotacao RDDF_PLACE_CT13 (casa com a MISSION abaixo)
SET GOAL_X=7757361.093785
SET GOAL_Y=-363791.251610
SET GOAL_THETA=-1.439969

# Missao do robo
SET MISSION=${PATH_CENTRAL}/geodata/mission_go_to_ct13.txt

# Arquivo de calibracao
SET CALIBRATION_FILE=calibration_table.txt

## Origem do mundo
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/params_argos.yaml

# Exemplo de entrada de proccontrol:
# module name        group_name    requested_state        watch_heartbeats    command_line

#### Serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PATH_CENTRAL}/parameters/carmen-argos.ini
 proc_control        support       1        0          ./proccontrol_gui
 jaus                support       1        0          ../sharedlib/OpenJAUS/ojNodeManager/bin/ojNodeManager ../sharedlib/OpenJAUS/ojNodeManager/nodeManager_Argos.conf a
 car_driver          support       1        0          sleep 3 && ../sharedlib/OpenJAUS/ojArgos/bin/ojArgos ${ODOM_CAN_BUS} ${COMMAND_CAN_BUS}
 map_server          support       1        0          ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on  -lanemap_incoming_message_type 0
 joystick            support       0        0          ./joystick_vehicle -direct_v_and_phi_mode on

#### Robo
 unitree_driver      robot         1        0          sleep 5 && ./argos_unitree_driver -network_interface ${NETWORK_INTERFACE} -can_interface ${COMMAND_CAN_BUS} -verbose on > argos_unitree_driver.txt
 ford_escape         robot         1        0          ./ford_escape_hybrid -robot_model_name 4 -tune_pid_mode on > results_pid.txt
 base_ackerman       robot         1        0          ./base_ackerman

#### Sensores
 XSENS               sensors       1        0          ./xsens_argos_go2 -network_interface ${NETWORK_INTERFACE}
 HESAI_32            sensors       1        0          ./hesai_driver -lidar_id ${LIDAR_SENSOR_ID} -host_ip ${LIDAR_HOST_IP}
 camera1             sensors       1        0          ./argos_unitree_camera -network_interface ${NETWORK_INTERFACE} -camera_id 1
 camera_lateral      sensors       0        0          ./camera_drivers intelbras4 4

#### Processamento dos dados dos Sensores
 gps_xyz             sensor_filter 1        0          ./gps_xyz
# MOT: manda a camera para o Hailo no Raspberry e publica neural_detector_message_${NIT_CAMERA}_name
# com caixa + track_id. -track 1 e' o que liga o rastreio; sem ele sai deteccao solta, nao MOT.
 pi_nit              sensor_filter 0        0          ./pi_nit_client_driver unitree1 ${NIT_CAMERA} -pi_host ${PI_NIT_HOST} -track 1 -person_only 1 -confidence 0.5
# Ponte: casa a caixa 2D com o lidar e publica carmen_moving_objects_point_clouds. E' o que
# faz o behavior_selector parar, o mapper marcar e os dois viewers desenharem a pessoa.
# EXIGE globalpos: sem localizacao ele nao publica (e avisa).
 nit_moving          sensor_filter 0        0          ./nit_moving_objects -cameras ${NIT_CAMERA} -camera_names unitree1 -lidar_id ${LIDAR_SENSOR_ID} -confidence 0.5 -verbose on

#### SLAM
 fused_odometry      SLAM          0        0          ./fused_odometry -use_gps off -force_initial_pose on -initial_x ${INITIAL_X} -initial_y ${INITIAL_Y} -initial_theta ${INITIAL_THETA}
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 mapper_creator      SLAM          0        0          ./mapper -map_path ${MAP_PATH} -mapping_mode on  -calibration_file ${CALIBRATION_FILE}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper
 rndf_build          SLAM          0        0          ./rddf_build ${RDDF_PATH}

#### Hierarquia de controle (top-down)
 task_manager        planner       0        0          ./task_manager -start_delay off -mission ${MISSION}
# '>>' e nao '>': o proccontrol respawna o modulo quando ele morre, e com '>' o
# redirecionamento TRUNCA o arquivo -- a saida da instancia que estourou e' apagada
# pela que nasce em seguida. Foi o que escondeu o segfault ate' agora.
 route_planner       planner       1        0          ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH} >> caco_route.txt 2>&1
 offroad_planner     planner       1        0          ./offroad_planner
 behavior_selector   planner       1        0          ./behavior_selector
 MPP                 planner       1        0          ./model_predictive_planner
 obstacle_avoider    planner       1        0          ./obstacle_avoider

#### Interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH} -annotation_path ${ANNOTATION_PATH}
 viewer_3D           interface     0        0          ./viewer_3D
 Cam_view            interface     1        0          ./camera_viewer unitree1 1 -resize 0.4
 Cam_view_nit        interface     0        0          ./camera_viewer_nit unitree1 ${NIT_CAMERA} -confidence 0.5 -resize 0.4
 Cam_view_lat        interface     0        0          ./camera_viewer 4

#### Voz
# O voice_alert decide o que anunciar a partir das transicoes do behavior_selector; o
# voice_driver_espeak renderiza. So' fala quando algum planner estiver no ar.
 voice_driver        voice         0        0          ./voice_driver_espeak
 voice_alert         voice         0        0          ./voice_alert

#### Utilitarios
 fake_gps            utils         0        0          ./util_publish_dummy_gps 20.2769 40.3044 0.0
 util_publish_initial_pose utils         0        0          ./util_publish_initial_pose ${ORIGIN_X}, ${ORIGIN_y}, ${ORIGIN_YAW}, 4, 0.0
 util_publish_final_goal utils         0        0          ./util_publish_final_goal    ${GOAL_X} ${GOAL_Y} ${GOAL_THETA} 5
 LOG_CREATE          utils         0        0          ./logger /dados/${LOG_PATH}

#### ROS / SC-LIO-SAM
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true > caco_bridge.txt
 SC-LIO-SAM          ros           1        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _origin_x:=${ORIGIN_X} _origin_y:=${ORIGIN_Y} _origin_z:=${ORIGIN_Z} _origin_yaw:=${ORIGIN_YAW} > caco_fused.txt 2>&1
