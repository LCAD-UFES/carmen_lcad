# ARGOS -- playback localizado no mapa, com a globalpos vinda do SC-LIO-SAM.
# Usa o mapa 2D e o mapa 3D gerados de log_argos_mapa_ufes-1.
# Ligue o fused_odom_slam e o rndf_build SO' depois que o robo encaixar no mapa.

SET PATH_CENTRAL=../data/argos
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen-argos.ini
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/params_argos.yaml

SET LOG_PATH=/dados/logs_argos/log_argos_mapa_ufes-1.txt

## Mapa 3D do SC-LIO-SAM (cloudGlobal.pcd, Scans/, SCDs/) e o 2D dentro dele
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/ufes_argos/
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d
SET GRAPH_PATH=${SC_LIO_SAM_MAP_PATH}graphs/grafo.gr
SET ANNOTATION_PATH=${SC_LIO_SAM_MAP_PATH}annotations/annotations.txt
SET RDDF_PATH=${SC_LIO_SAM_MAP_PATH}rddf/rddf_ufes.txt

## Origem do mapa: primeira pose do poses_opt.dat que gerou a grade
SET MAP_X=7757339
SET MAP_Y=-363784

## Origem do mundo -- TEM que bater com posesOrigin* do params_argos.yaml
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0

## O LiDAR do ARGOS e' o 5 (VELODYNE_VARIABLE_SCAN_IN_FILE5, Pandar XT-32)
SET LIDAR_SENSOR_ID=5

SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

# module name        group_name   requested_state  watch_heartbeats  command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0.01' -speed 1.0
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 fake_gps            filter        0        0          ./util_publish_dummy_gps 20.2769 40.3044 0.0
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
# -mapping_mode on: faz o localize virar pass-through da fused_odometry do SLAM.
# O mapper aqui NAO grava (sem -mapping_mode): so' consome o mapa offline.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on > caco_localize.txt 2>&1
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper
# LIGAR depois do encaixe: grava a rota percorrida em RDDF_PATH
 rndf_build          SLAM          1        0          ./rddf_build ${RDDF_PATH}

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D           monitors      1        0          ./viewer_3D -fv_flag on

#### ROS / SC-LIO-SAM
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true > caco_bridge.txt 2>&1
 SC-LIO-SAM          ros           1        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch gpu:=true localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt 2>&1

#### injecao da localizacao -- LIGAR SO' depois do robo encaixar no mapa no RViz
 fused_odom_slam     ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _origin_x:=${ORIGIN_X} _origin_y:=${ORIGIN_Y} _origin_z:=${ORIGIN_Z} _origin_yaw:=${ORIGIN_YAW} > caco_fused.txt 2>&1

#### NAO LIGAR: publicaria fused_odometry em paralelo com o no' acima
# fused_odometry     filter        0        0      ./fused_odometry
