## Navegacao em SIMULACAO no mapa da UFES.
##
## E' o process-argos-navigate.ini (que roda no simulator_ackerman, sem hardware nenhum)
## apontado para o mapa/grafo/anotacoes que o process-argos-tudo-no-pc-2.ini usa no robo real.
## Serve para testar route_planner / offroad_planner / behavior_selector / MPP sem o Go2,
## sem lidar, sem CAN e sem o SC-LIO-SAM.
##
## Nao ha nenhum modulo de sensor, de rede ou de ROS aqui: quem fecha a malha e' o
## simulator_ackerman, que recebe o comando do obstacle_avoider e devolve odometria.

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos

## ---------------------------------------------------------------------------------------
## Mapa. Mesma organizacao do process-argos-tudo-no-pc-2.ini: para trocar de mapa, troque
## SO' a linha do SC_LIO_SAM_MAP_PATH -- todo o resto e' derivado dela.
## ---------------------------------------------------------------------------------------
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/ufes_argos/
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d
SET GRAPH=${SC_LIO_SAM_MAP_PATH}graphs/graph-rddf_ufes.gr
## Neste mapa as anotacoes ficaram DENTRO do map2d, nao como irmas dele
SET ANNOTATIONS=${MAP_PATH}/annotations/annotations.txt

## Origem do mapa: primeira pose do poses_opt.dat que gerou a grade.
## E' coordenada UTM de verdade, nao o 1000/1000 dos mapas antigos.
SET MAP_X=7757339
SET MAP_Y=-363784

## ---------------------------------------------------------------------------------------
## Pose inicial e objetivo. Os dois saem de anotacoes reais do
## map2d/annotations/annotations.txt -- se mudar uma, pegue x/y/theta de la'.
##
## Anotacoes disponiveis neste mapa:
##   RDDF_PLACE_IC1      7757084.080820  -363885.860142   1.669242
##   RDDF_PLACE_Honofre  7757139.106870  -363902.184232   3.129828
##   RDDF_PLACE_CT3      7757331.892985  -363894.731945  -3.075024
##   RDDF_PLACE_CT7      7757351.421020  -363819.296545  -2.287338
##   RDDF_PLACE_CT13     7757361.093785  -363791.251610  -1.439969
##   RDDF_PLACE_LCAD     7757339.527777  -363784.042662  -0.079830
## ---------------------------------------------------------------------------------------

## Partida -- anotacao RDDF_PLACE_LCAD
SET START_X=7757339.527777
SET START_Y=-363784.042662
SET START_THETA=-0.079830

## Chegada -- anotacao RDDF_PLACE_CT13
SET GOAL_X=7757361.093785
SET GOAL_Y=-363791.251610
SET GOAL_THETA=-1.439969

## Missao do task_manager. Ele fica desligado abaixo; esta linha so' vale se voce ligar.
SET MISSION=${PATH_CENTRAL}/geodata/mission_argos_teste.txt

## Arquivo de parametros
SET PARAM_FILE=${PATH_CENTRAL}/parameters/carmen-argos.ini

# Exemplo de entrada de proccontrol:
#module name             group_name    requested_state    watch_heartbeats    command_line

#### Serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_FILE}
 proc_control        support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on  -lanemap_incoming_message_type 0

#### Carro (simulado)
 simulator           support       1        0          ./simulator_ackerman
 joystick            support       0        0          ./joystick_vehicle -direct_v_and_phi_mode on

#### SLAM
 gps_xyz             sensor_filter 1        0          ./gps_xyz
 fused_odometry      SLAM          1        0          ./fused_odometry
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode off
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper

#### Hierarquia de controle (top-down)
## Sobem DESLIGADOS de proposito, como no process-argos-navigate.ini: espere a pose
## convergir no navigator_gui2 e so' entao ligue os cinco pelo proccontrol_gui, de cima
## para baixo. Ligar antes da localizacao fechar faz o route_planner planejar a partir de
## uma pose errada.
 task_manager        planner       0        0          ./task_manager -start_delay off -mission ${MISSION}
 route_planner       planner       0        0          ./route_planner --graph ${GRAPH} ${ANNOTATIONS} >> caco_route.txt 2>&1
 offroad_planner     planner       0        0          ./offroad_planner
 behavior_selector   planner       0        0          ./behavior_selector
 MPP                 planner       0        0          ./model_predictive_planner
 obstacle_avoider    planner       0        0          ./obstacle_avoider

#### Interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH} -annotation_path ${ANNOTATIONS}
 viewer_3D           interface     0        0          ./viewer_3D

#### Pose inicial e objetivo (publicados 4 s depois de subir, para dar tempo aos modulos)
 util_publish_initial_pose init_pose     1        0          ./util_publish_initial_pose ${START_X}, ${START_Y}, ${START_THETA}, 4, 0.0
 util_publish_final_goal   final_goal    1        0          ./util_publish_final_goal ${GOAL_X}, ${GOAL_Y}, ${GOAL_THETA}, 4, 0.0
