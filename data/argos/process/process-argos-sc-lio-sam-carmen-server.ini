# ARGOS real, autonomo, com a localizacao pelo SC-LIO-SAM (ROS 1 Noetic) rodando DENTRO do ARGOS
# e a interface no notebook (carmen_app). Igual ao process-argos-robo-real-carmen-server.ini, mas
# o localize_ackerman da' lugar ao SC-LIO-SAM em modo de localizacao no mapa abaixo.
#
# Antes, uma vez por boot do ARGOS (sudo):
#     sudo modprobe vcan
#     bash ~/carmen_lcad/bin/argos/init_vcan_argos.bat
# Rodar a partir de bin/ (com o central ja' no ar):
#     ./proccontrol ../data/argos/process/process-argos-sc-lio-sam-carmen-server.ini
# No notebook:
#     ~/carmen_lcad/bin/carmen_app --host 192.168.123.18
#
# Os nos ROS rodam pelo ../data/argos/ros1_noetic.sh, que tira do ambiente o ROS 2 Foxy que o
# .bashrc do ARGOS carrega (misturado com o Noetic, o roslaunch acha os pacotes errados).
#
# Ordem da localizacao: hesai + xsens -> ros_bridge (IPC -> ROS) -> SC-LIO-SAM (localiza no mapa)
#   -> fused_odom_slam (ROS -> IPC: fused_odometry no referencial do mapa) -> localize_ackerman
#   em -mapping_mode on, que so' repassa como globalpos (como no process-argos-tudo-no-pc-2.ini).
#
# POSE INICIAL: o SC-LIO-SAM nao se acha sozinho neste mapa (sem gps_utm_anchor.txt). Use "Pose
# inicial" no app: clique onde o robo esta' e arraste para onde ele aponta. O fused_odom_slam
# repassa para o /initialpose e o SC-LIO-SAM refaz o ICP ali.
#
# WATCHDOG: -app_watchdog 5 = se o carmen_server ficar 5 s sem ouvir o app (Wi-Fi caiu, app fechou),
# ele manda STOP no robo. Depois que o app volta, e' preciso dar GO de novo.
#
# Os nos ROS usam "exec" para o proccontrol matar o roslaunch de verdade (sem exec sobravam orfaos).

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos
SET PARAM_FILE=${PATH_CENTRAL}/parameters/carmen-argos.ini
SET ROS1=${PATH_CENTRAL}/ros1_noetic.sh

# Rede do Go2 na Jetson (o Go2 responde em 192.168.123.161; o Hesai em 192.168.1.201 pelo mesmo cabo)
SET NETWORK_INTERFACE=eth0
SET ODOM_CAN_BUS=vcan0
SET COMMAND_CAN_BUS=vcan0
SET LIDAR_SENSOR_ID=5

# libddsc do unitree_sdk2 (a de /usr/local quebra o VideoClient da camera)
SET UNITREE_DDS_LIB=/home/unitree/unitree_sdk2/thirdparty/lib/aarch64

# Mapa da UFES gerado pelo SC-LIO-SAM. Trocar de mapa = trocar SO' a primeira linha
# (a barra no fim e' obrigatoria: sem ela o mapOptmization respawna para sempre).
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/ufes_argos/
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d
SET GRAPH_PATH=${SC_LIO_SAM_MAP_PATH}graphs/graph-rddf_ufes.gr
SET ANNOTATION_PATH=${MAP_PATH}/annotations/annotations.txt
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/params_argos.yaml

# Origem da grade 2D (primeira pose do poses_opt.dat que gerou o mapa)
SET MAP_X=7757339
SET MAP_Y=-363784

# Origem do mundo: o SC-LIO-SAM trabalha relativo a ela
SET ORIGIN_X=7757339.037
SET ORIGIN_Y=-363784.117
SET ORIGIN_Z=0.0
SET ORIGIN_YAW=0.0

# Pose inicial do robo DENTRO do mapa do SC-LIO-SAM (relativa a origem acima; 0 = RDDF_PLACE_LCAD)
SET START_X=0.0
SET START_Y=0.0
SET START_Z=0.0
SET START_ROLL=0.0
SET START_PITCH=0.0
SET START_THETA=0.0

SET MISSION=${PATH_CENTRAL}/geodata/mission_argos_teste.txt
SET LOG_PATH=log_argos_sc_lio_sam.txt

# module name        group_name    requested_state  watch_heartbeats  command_line

#### Servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_FILE}
 proc_control        support       1        0          ./carmen_server -app_watchdog 5 -missions_folder ${PATH_CENTRAL}/geodata -annotation_path ${ANNOTATION_PATH} -map_path ${MAP_PATH}
 jaus                support       1        0          exec ../sharedlib/OpenJAUS/ojNodeManager/bin/ojNodeManager ../sharedlib/OpenJAUS/ojNodeManager/nodeManager_Argos.conf a >> caco_jaus.txt 2>&1
 car_driver          support       1        0          ../sharedlib/OpenJAUS/ojArgos/bin/ojArgos ${ODOM_CAN_BUS} ${COMMAND_CAN_BUS}
 map_server          support       1        0          ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0
 joystick            support       0        0          ./joystick_vehicle -direct_v_and_phi_mode on

#### Robo
 unitree_driver      robot         1        0          exec ./argos_unitree_driver -network_interface ${NETWORK_INTERFACE} -can_interface ${COMMAND_CAN_BUS} -verbose on >> argos_unitree_driver.txt 2>&1
 ford_escape         robot         1        0          exec ./ford_escape_hybrid -robot_model_name 4 -tune_pid_mode on > results_pid.txt
 base_ackerman       robot         1        0          ./base_ackerman

#### Sensores
 XSENS               sensors       1        0          ./xsens_argos_go2 -network_interface ${NETWORK_INTERFACE}
 ODOM_6D             sensors       1        0          ./odometry_6d_go2 -network_interface ${NETWORK_INTERFACE}
 HESAI_32            sensors       1        0          ./hesai_driver -lidar_id ${LIDAR_SENSOR_ID}
# Camera desligada por padrao: ~70% de CPU (decodifica o JPEG 1080p do Go2). Ligue na aba Modulos do app.
 camera1             sensors       0        0          LD_LIBRARY_PATH=${UNITREE_DDS_LIB} ./argos_unitree_camera -network_interface ${NETWORK_INTERFACE} -camera_id 1 -resize_factor 0.33 -publish_hz 10
 gps_xyz             sensors       1        0          ./gps_xyz

#### ROS / SC-LIO-SAM (master unico primeiro; os outros esperam ele)
 roscore             ros           0        0          exec ${ROS1} roscore >> caco_roscore.txt 2>&1
 ros_bridge          ros           0        0          exec ${ROS1} roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true >> caco_bridge.txt 2>&1
 SC-LIO-SAM          ros           0        0          exec ${ROS1} roslaunch lio_sam run.launch rviz:=false localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true >> caco_sclio.txt 2>&1
 fused_odom_slam     ros           0        0          exec ${ROS1} rosrun carmen_ipc_bridge fused_odometry_from_slam_node _origin_x:=${ORIGIN_X} _origin_y:=${ORIGIN_Y} _origin_z:=${ORIGIN_Z} _origin_yaw:=${ORIGIN_YAW} >> caco_fused.txt 2>&1

#### SLAM (carmen)
 localize-sc         SLAM          0        0          ./localize_ackerman -mapping_mode on
# Predicao 4: o filtro de particulas integra as velocidades da odometria 6D (odometry_6d_go2,
# src/odometry_6d) e o lidar so' corrige. Sem a odometria 6D cai na predicao 3.
# Ruidos ajustaveis por -localize_ackerman_odom6d_xy_noise 0.05, _lateral_noise 0.02,
# _theta_noise 0.05, _theta_noise_per_meter 0.01 (padroes no codigo).
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode off -localize_ackerman_prediction_type 4
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper

#### Hierarquia de controle (top-down)
 task_manager        planner       0        0          ./task_manager -start_delay off -mission ${MISSION}
 route_planner       planner       1        0          exec ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH} >> caco_route.txt 2>&1
 offroad_planner     planner       1        0          ./offroad_planner
 behavior_selector   planner       1        0          ./behavior_selector
 MPP                 planner       1        0          ./model_predictive_planner
 obstacle_avoider    planner       1        0          ./obstacle_avoider

#### Utilitarios
 LOG_CREATE          utils         0        0          ./logger /dados/${LOG_PATH}
