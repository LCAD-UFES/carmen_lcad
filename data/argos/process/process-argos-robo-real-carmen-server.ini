# ARGOS real (Go2 + Hesai + Xsens) com tudo rodando DENTRO do ARGOS e a interface no notebook:
#  - proc_control roda ./carmen_server (ponte ZMQ) no lugar do ./proccontrol_gui
#  - sem navigator_gui / viewer_3D: a interface e' o carmen_app no notebook
#    (cd ~/carmen_lcad/src/carmen_app && make && ../../bin/carmen_app --host 192.168.123.18)
#  - localizacao pelo localize_ackerman no mapa abaixo (o mesmo do teste com o simulador)
#
# Antes de rodar, uma vez por boot do ARGOS (precisa de sudo):
#     sudo modprobe vcan
#     bash ~/carmen_lcad/bin/argos/init_vcan_argos.bat
# Rodar a partir de bin/ (com o central ja' no ar; no ARGOS e' o 'central' do PATH):
#     ./proccontrol ../data/argos/process/process-argos-robo-real-carmen-server.ini
#
# Cadeia de comando: planner -> ford_escape_hybrid (PID) -> ojArgos -> CAN 0x100 (vcan0)
#   -> argos_unitree_driver -> Go2 (SportClient::Move); a odometria volta pelo mesmo caminho.

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos
SET PARAM_FILE=${PATH_CENTRAL}/parameters/carmen-argos.ini

# Rede do Go2 na Jetson (o Go2 responde em 192.168.123.161)
SET NETWORK_INTERFACE=eth0

# CAN virtual entre o ojArgos e o argos_unitree_driver
SET ODOM_CAN_BUS=vcan0
SET COMMAND_CAN_BUS=vcan0

SET LIDAR_SENSOR_ID=5

# libddsc do unitree_sdk2 (a de /usr/local quebra o VideoClient da camera)
SET UNITREE_DDS_LIB=/home/unitree/unitree_sdk2/thirdparty/lib/aarch64

# Mapa, grafo e anotacoes. Trocar de lugar = trocar estas 5 linhas (e a pose inicial).
SET MAP_PATH=../data/map_argos_holofre_20260514
SET MAP_X=1000.0
SET MAP_Y=1000.0
SET GRAPH=argos/graph/graph_map_argos_holofre_20260514.gr
SET ANNOTATIONS=argos/argos-rddf-ct13.txt

# Pose inicial aproximada (perto do LCAD4). Corrigir no app com "Pose inicial" + 2 cliques.
SET START_X=1000.0
SET START_Y=1000.0
SET START_THETA=-1.57

SET MISSION=${PATH_CENTRAL}/geodata/mission_argos_teste.txt
SET LOG_PATH=log_argos_robo_real.txt

# Exemplo de entrada de proccontrol:
# module name        group_name    requested_state  watch_heartbeats  command_line

#### Servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_FILE}
 proc_control        support       1        0          ./carmen_server -app_watchdog 5 -missions_folder ${PATH_CENTRAL}/geodata -annotation_path ${ANNOTATIONS} -map_path ${MAP_PATH}
 jaus                support       1        0          exec ../sharedlib/OpenJAUS/ojNodeManager/bin/ojNodeManager ../sharedlib/OpenJAUS/ojNodeManager/nodeManager_Argos.conf a >> caco_jaus.txt 2>&1
 car_driver          support       1        0          sleep 3 && ../sharedlib/OpenJAUS/ojArgos/bin/ojArgos ${ODOM_CAN_BUS} ${COMMAND_CAN_BUS}
 map_server          support       1        0          ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0
 joystick            support       0        0          ./joystick_vehicle -direct_v_and_phi_mode on

#### Robo
 unitree_driver      robot         1        0          sleep 5 && ./argos_unitree_driver -network_interface ${NETWORK_INTERFACE} -can_interface ${COMMAND_CAN_BUS} -verbose on >> argos_unitree_driver.txt 2>&1
 ford_escape         robot         1        0          exec ./ford_escape_hybrid -robot_model_name 4 -tune_pid_mode on > results_pid.txt
 base_ackerman       robot         1        0          ./base_ackerman

#### Sensores
 XSENS               sensors       1        0          ./xsens_argos_go2 -network_interface ${NETWORK_INTERFACE}
 HESAI_32            sensors       1        0          ./hesai_driver -lidar_id ${LIDAR_SENSOR_ID}
# Camera do Go2. O LD_LIBRARY_PATH e' obrigatorio: com a libddsc de /usr/local o VideoClient
# morre com "free(): invalid pointer" ao subir; a do proprio unitree_sdk2 funciona.
# -resize_factor 0.33: 1920x1080 vira 640x360 (1080p a 15 Hz sao ~90 MB/s no IPC).
# Desligada por padrao: custa ~70% de CPU (decodifica o JPEG 1080p do Go2). Ligue na aba Modulos do app.
 camera1             sensors       1        0          LD_LIBRARY_PATH=${UNITREE_DDS_LIB} ./argos_unitree_camera -network_interface ${NETWORK_INTERFACE} -camera_id 1 -resize_factor 0.33 -publish_hz 10

#### Processamento dos sensores
 gps_xyz             sensor_filter 1        0          ./gps_xyz

#### SLAM
 localize            SLAM          1        0          exec ./localize_ackerman -mapping_mode off >> caco_localize.txt 2>&1
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper

#### Hierarquia de controle (top-down)
 task_manager        planner       0        0          ./task_manager -start_delay off -mission ${MISSION}
 route_planner       planner       1        0          exec ./route_planner --graph ${GRAPH} ${ANNOTATIONS} >> caco_route.txt 2>&1
 offroad_planner     planner       1        0          ./offroad_planner
 behavior_selector   planner       1        0          ./behavior_selector
 MPP                 planner       1        0          ./model_predictive_planner
 obstacle_avoider    planner       1        0          ./obstacle_avoider

#### Utilitarios
 init_pose           init_pose     1        0          ./util_publish_initial_pose ${START_X}, ${START_Y}, ${START_THETA}, 4, 0.0
 LOG_CREATE          utils         0        0          ./logger /dados/${LOG_PATH}
