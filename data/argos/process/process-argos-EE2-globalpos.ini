## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/argos

# Geracao de mapa do EE2 com graphslam_publish_globalpos.
#
# SEM localize_ackerman: a globalpos vem direto do poses_opt.dat, casada com o
# timestamp da propria mensagem de lidar (1 us). Ver
# src/graphslam/README_publish_globalpos.md.
#
# O poses_opt.dat do EE2 foi gerado com:
#   ./optimized_poses_to_poses_opt.py /dados/sc_lio_sam_output/EE2 \
#       /dados/logs_argos/log_argos_EE_20260817-1.txt \
#       /dados/sc_lio_sam_output/EE2/poses_opt.dat \
#       --origin-x 7757339.037 --origin-y -363784.117
# Ele so' tem os KEYFRAMES do SC-LIO-SAM: 378 poses para 1583 scans (24%). Os
# outros 76% dos scans nao tem pose exata e NAO sao pintados -- e' o comportamento
# correto do modulo. Para cobertura cheia, gere o poses_opt.dat rodando o
# SC-LIO-SAM com a ponte /carmen/scan_time_reference (writeLocalizationPose).

SET LOG_PATH=/dados/logs_argos/log_argos_EE_20260817-1.txt
SET PARAM_PATH=${PATH_CENTRAL}/parameters/carmen-argos.ini

SET POSES_PATH=/dados/sc_lio_sam_output/poses_opt.dat
SET MAP_FILES_PATH=/dados/sc_lio_sam_output/EE2/map2d

# UTM inicial do log. Sao CARMEN_PARAM_INT -- passe inteiros.
SET MAP_X=7757339
SET MAP_Y=-363784

SET LIDAR_ID=5

# Onde a globalpos publicada e' gravada: "x  y  theta  v  phi  timestamp" (TAB),
# o mesmo formato do localize_ackerman -save_globalpos_file.
SET GLOBALPOS_OUT=/dados/sc_lio_sam_output/EE2/globalpos_EE2.txt

# module name        group_name   requested_state  watch_heartbeats  command_line

#### suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message "t 0" -autostart on
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### sensores
 base_ackerman       filter        1        0          ./base_ackerman
# gps_xyz nao faz falta: este log nao tem nenhuma mensagem de GPS e a pose vem do poses_opt.
 gps_xyz             filter        0        0          ./gps_xyz

#### pose  (NAO ha localize_ackerman aqui -- e' esse o ponto do teste)
 pub_poses           SLAM          1        0          ./graphslam_publish_globalpos ${POSES_PATH} -poses_from lidar -lidar_id ${LIDAR_ID} -save_globalpos_file ${GLOBALPOS_OUT}

#### mapa
# Gate de pose LIGADO. Com 24% de cobertura a globalpos fica velha entre keyframes,
# entao 0.06 s (~1 periodo do lidar a 20 Hz) e' o que separa scan bem casado de scan
# pintado com pose defasada. Ponha 0 nos tres para desligar o gate e comparar.
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on -pose_gate_max_delay 0.06 -pose_gate_jump 0.5 -pose_gate_settle 20

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D

#### pos-processamento (ligar no proccontrol_gui quando o playback terminar)
 CleanMap            graphslam     0        0          rm -f ${MAP_FILES_PATH}/*.map; echo "map2d limpo"; sleep 30m
 complete_map        graphslam     0        0          ./build_complete_map -map_path ${MAP_FILES_PATH}; echo "Programa concluido normalmente"; sleep 30m
