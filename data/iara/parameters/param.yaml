# Launch: map_directory e localizationMode obrigatórios; gpu opcional (false).
# Mapeamento recria map_directory; localização preserva o mapa.

lio_sam:
  # Tópicos
  pointCloudTopic: "/points_raw_no_vehicle"  # Nuvem sem os pontos do veículo.
  imuTopic: "/imu_raw"
  odomTopic: "odometry/imu"
  gpsTopic: "odometry/gps"
  ackermannTopic: "/ackermann/odom_raw"  # Velocidade e esterçamento (TwistStamped).

  # Predição de odometria
  odometrySource: "ackermann"  # imu | ackermann | fusion
  wheelbase: 2.625  # Distância entre eixos [m].
  ackermannVelNoise: 0.05  # Fusion: sigma da velocidade [m/s].
  ackermannSteerNoise: 0.05  # Fusion: sigma do esterçamento [rad].
  ackermannSlipNoiseX: 0.05  # Fusion: slip longitudinal [m/√s].
  ackermannSlipNoiseY: 0.05  # Fusion: slip lateral [m/√s].
  ackermannSlipNoiseTheta: 0.02  # Fusion: slip angular [rad/√s].
  ackermannYawLockKeyframes: 0  # Ackermann: keyframes mínimos para liberar a rotação; 0 = só mapa não vazio.

  # Frames
  lidarFrame: "velodyne"
  baselinkFrame: "base_link"
  odometryFrame: "odom"
  mapFrame: "map"

  # GPS e orientação inicial
  useImuHeadingInitialization: true  # Inicializa o yaw pelo IMU.
  useGpsElevation: true  # Usa a altitude do GPS.
  gpsCovThreshold: 2000.0  # Covariância máxima do GPS [m²].
  poseCovThreshold: 25.0  # Limiar de covariância da pose para usar GPS [m²].
  gpsAnchorIgnoreCov: false  # Ignora o limiar de covariância ao ancorar o GPS.

  # Processamento
  slamQueueSize: 1  # Fila de scans; menor favorece tempo real.
  numberOfCores: 12
  mappingProcessInterval: 0.015  # Intervalo mínimo entre scans processados [s].

  # Localização: pose inicial de base_link no mapa [m, rad]
  localizationMode: true  # Ignorado pelos launches ROS 2; passe via linha de comando.
  initialPoseX: 0.0
  initialPoseY: 0.0
  initialPoseZ: 0.0
  initialPoseRoll: 0.0
  initialPosePitch: 0.0
  initialPoseYaw: 0.0

  # poses_opt.dat: grava após o encaixe no mapa, em localização
  posesEnable: true
  posesOutputFile: "/dados/sc_lio_sam_output/poses_opt.dat"
  posesStartTime: 0.0  # Timestamp ROS mínimo [s]; 0 desativa o corte.
  posesSettleScans: 20  # Scans descartados após cada encaixe.
  posesInterpolateMaxError: 0.10  # Erro máximo da interpolação [m].
  posesInterpolateMaxGap: 5.0  # Intervalo máximo [s]; 0 desativa a interpolação.
  posesAstroStampTopic: "/astro/scan_time_reference"  # Referência de tempo ASTRO/ROS.
  posesAckermannTopic: "/ackermann/odom_raw"  # Preenche odometry_ts; sem mensagem, usa -1.

  # Origem: x=northing, y=-easting [m]; yaw relativo [rad]
  posesOriginMode: "gps"  # manual | gps; manual usa posesOrigin*.
  # Origem manual: manter |x| >= 1000000 para publicar globalpos.
  posesOriginX: 1000000.0
  posesOriginY: 0.0
  posesOriginZ: 0.0
  posesOriginYaw: 0.0
  posesOriginLock: false  # GPS: impede atualizar a origem.
  posesOriginRefine: false  # GPS: continua refinando a origem.
  posesOriginMinSamples: 20  # GPS: amostras mínimas.
  posesOriginMaxDt: 0.50  # GPS: intervalo máximo entre scans [s].
  posesOriginMinBaseline: 1.0  # GPS: deslocamento mínimo para estimar o rumo [m].
  posesOriginRelPosNoise: 0.25  # GPS: variância relativa da posição [m²].

  # LiDAR
  sensor: velodyne  # Ignorado pelo código atual.
  N_SCAN: 128  # Número de linhas.
  Horizon_SCAN: 1800  # Colunas por volta.
  downsampleRate: 4  # Passo entre linhas; 1 usa todas.
  lidarMinRange: 0.01  # m
  lidarMaxRange: 230.0  # m

  # IMU
  imuAccNoise: 0.006738  # Ruído do acelerômetro [m/s²/√Hz].
  imuGyrNoise: 0.00660  # Ruído do giroscópio [rad/s/√Hz].
  imuAccBiasN: 0.059011  # Random walk do bias do acelerômetro.
  imuGyrBiasN: 0.000009  # Random walk do bias do giroscópio.
  imuGravity: 9.8315  # m/s²
  imuRPYWeight: 0.1  # Peso do IMU em roll/pitch [0–1].

  # Extrínseca IMU → LiDAR
  extrinsicTrans: [0.65, 0.13, 0.50]  # x, y, z [m]
  extrinsicRPY: [-0.0174444, -0.036, 1.5707963267948966]  # roll, pitch, yaw [rad]

  # Caixa de exclusão no frame do LiDAR [m]
  lidarExcludeBoxEnable: false
  lidarExcludeBoxMinX: -3.0
  lidarExcludeBoxMaxX: 1.0
  lidarExcludeBoxMinY: -2.0
  lidarExcludeBoxMaxY: 2.0
  lidarExcludeBoxMinZ: -2.5
  lidarExcludeBoxMaxZ: 2.5

  # Features LOAM
  edgeThreshold: 1.0
  surfThreshold: 0.1
  edgeFeatureMinValidNum: 10
  surfFeatureMinValidNum: 100

  # Filtros voxel [m]
  odometrySurfLeafSize: 0.4
  mappingCornerLeafSize: 0.2
  mappingSurfLeafSize: 0.4

  # Restrições de movimento
  z_tollerance: 1000  # Limite de altura [m].
  rotation_tollerance: 1000  # Limite de roll/pitch [rad].

  # Mapa local
  surroundingkeyframeAddingDistThreshold: 2.0  # Distância mínima entre keyframes [m].
  surroundingkeyframeAddingAngleThreshold: 0.2  # Rotação mínima entre keyframes [rad].
  surroundingKeyframeDensity: 1.0  # Voxel dos keyframes vizinhos [m].
  surroundingKeyframeSearchRadius: 30.0  # Raio de busca [m].

  # Loop closure
  loopClosureEnableFlag: true
  loopClosureFrequency: 1.0  # Hz
  surroundingKeyframeSize: 50  # Sem efeito no código atual.
  historyKeyframeSearchRadius: 50.0  # Raio de busca [m].
  historyKeyframeSearchTimeDiff: 10.0  # Separação temporal mínima [s].
  historyKeyframeSearchNum: 12  # Keyframes agregados no candidato.
  historyKeyframeFitnessScore: 0.5  # Score ICP máximo; menor é mais restritivo.

  # Visualização
  globalMapVisualizationSearchRadius: 1000.0  # Raio [m].
  globalMapVisualizationPoseDensity: 10.0  # Espaçamento entre poses [m].
  globalMapVisualizationLeafSize: 0.01  # Voxel [m].

carmen_ros_bridge:

  # Colisão: alturas e margem dos cilindros [m]
  robot_collision_height: 2.5
  semi_trailer_collision_height: 5.0
  collision_safety_margin: 0.25

  # GPS XYZ: sigma horizontal [m]; covariância = sigma²
  gps_sigma_xy_quality_1: 5.0
  gps_sigma_xy_quality_2: 1.0
  gps_sigma_xy_quality_4: 0.02
  gps_sigma_xy_quality_5: 0.20
  gps_sigma_xy_default: 50.0  # Demais qualidades válidas; qualidade < 1 é descartada.
  gps_sigma_z_multiplier: 3.0  # sigma_z = sigma_xy × fator; deve ser positivo.
