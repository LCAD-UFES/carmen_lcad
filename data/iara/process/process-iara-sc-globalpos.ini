## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

## Path do mapa 2D
SET MAP_PATH=${PATH_CENTRAL}/geodata/mapa_norte_ufes/map_files
SET GRAPH_PATH=${MAP_PATH}/
SET ANNOTATION_PATH=${PATH_CENTRAL}/geodata/annotations/annotations.txt
SET MISSION_PATH=${MAP_PATH}/../missions/
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini
SET RDDF_PATH=${PATH_CENTRAL}/geodata/
SET AUDIT_PATH=/dados/audit
SET LIDAR_SENSOR_ID=0

## Mapa 3D do SC-LIO-SAM (contem tambem o map_world_origin.txt)
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/mapa_saida_norte_ufes/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/param.yaml

SET PI_NIT_CAMERA=intelbras1
SET PI_NIT_CAMERA_MSG=1
SET PI_NIT_HOST=192.168.1.20

SET PI_NIT_PYTHON=../data/multiple_object_tracker/venv/bin/python3
SET PI_NIT_SERVER=../src/pi_nit/pi_nit_server/pi_nit_server.py
SET PI_NIT_WEIGHTS=../data/multiple_object_tracker/weights/yolov8n.pt

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 jaus                support       1        0          ../sharedlib/OpenJAUS/ojNodeManager/bin/ojNodeManager
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 proccontrol_gui     support       1        0          ./proccontrol_gui
 task_manager        support       0        0          ./task_manager -mission_from_user_app on -start_delay off
 mss                 support       1        0          ./map_server -map_path ${MAP_PATH} -block_map on
# SEM EQUIVALENTE NO CARMEN: audit nao existe no carmen
#audit               support       0        0          ./audit -split_txt off -save_dir ${AUDIT_PATH} endurance.txt -record_always on
 logger              support       0        0          bash -c './logger /dados/logs_iara/log_iara-$(date +%Y-%m-%d_%H-%M-%S).txt'

#### Robo
 ford_escape         robot         1        0          ./ford_escape_hybrid -robot_model_name 3 > results_pid.txt
 base_ackerman       robot         1        0          ./base_ackerman

#### sensores
 gps                 sensors       1        0          ./gps_nmea_trimble
 camera_1            sensors       1        0          ./camera_drivers intelbras1 1 -undistort off
 hesai               sensors       1        0          ./hesai_driver -lidar_id 0
 imu                 sensors       1        0          ./imu_can_driver -hz 200
 MOT                 detection     0        0          ./nit_moving_objects
# SEM EQUIVALENTE NO CARMEN: neural_image_tracker (docker) nao existe no carmen
#NIT                 detection     0        0          docker exec -it neural_object_tracker ./neural_image_tracker intelbras1 1
 pi_nit_local        detection     0        0          ./pi_nit_client_driver ${PI_NIT_CAMERA} ${PI_NIT_CAMERA_MSG} -pi_host 127.0.0.1 -fps 15
 pi_nit_rasp         detection     0        0          ./pi_nit_client_driver ${PI_NIT_CAMERA} ${PI_NIT_CAMERA_MSG} -pi_host ${PI_NIT_HOST} -fps 15
# SEM EQUIVALENTE NO CARMEN: image_path_projector nao existe no carmen
#IPP                 detection     0        0          ./image_path_projector intelbras1 1

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz

#### SLAM
# ATENCAO: -mapping_mode ON. E' isso que faz o localize virar pass-through da
# fused_odometry em vez de rodar o filtro de particulas.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on -lidar 0 > caco_localize.txt
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper

#### ROS / SC-LIO-SAM  (use_sim_time OFF -- aqui e' sensor ao vivo, nao playback)
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=false > caco_bridge.txt
 SC-LIO-SAM          ros           0        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=false > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           0        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _world_origin_file:=${WORLD_ORIGIN} > caco_fused.txt 2>&1

#### hierarquia de controle -- LIGAR SO' DEPOIS DE VALIDAR A POSE
 route_planner       planner       0        0          ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH}
 offroad_planner     planner       0        0          ./offroad_planner
 behavior_select     planner       0        0          ./behavior_selector
 MPP                 planner       0        0          ./model_predictive_planner
 obstacle_avoider    planner       0        0          ./obstacle_avoider

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D           monitors      1        0          ./viewer_3D
 Camera1             monitors      0        0          ./camera_viewer intelbras1 1

#### NAO LIGAR: publicaria astro_fused_odometry_message em paralelo com o no' acima
# fused_odometry     filter        0        0          ./fused_odometry
