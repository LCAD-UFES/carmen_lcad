## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

## Path do mapa 2D (grade)
SET MAP_PATH=${PATH_CENTRAL}/geodata/mapa_volta_ufes/map_files
#SET MAP_PATH=../data/map_volta_da_ufes-20220614

## Rota do mapa
SET GRAPH_PATH=${MAP_PATH}/../graphs/graph_volta_da_ufes-201903025_150m-9.gr

## Anotacao do mapa
SET ANNOTATION_PATH=${MAP_PATH}/../annotations/rddf_annotation_log_20140418.txt

## Path da missao
SET MISSION_PATH=${MAP_PATH}/../missions/

## RDDF para o build RDDF
SET RDDF_PATH=${MAP_PATH}/../rddf/rddf_volta_da_ufes.txt

## Parametros -- este process NAO usa o carmen.ini, e sim o ini da sensorbox
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen-ford-escape-sensorbox.ini

## local do log para o playback
SET LOG_PATH=/dados/aruco/log_aruco-20220916-7.txt

# module name         group_name    requested_state    watch_heartbeats    command_line

#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH} # -autostart on
 playback_control    support       1        0          ./playback_control
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_PATH} -block_map on

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
 fused_odometry      SLAM          1        0          ./fused_odometry
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode off
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper
 rddf_build          SLAM          0        0          ./rddf_build ${RDDF_PATH}

#### hierarquia de controle (top-down)
 route_planner       planner       1        0          ./route_planner --graph ${GRAPH_PATH} ${ANNOTATION_PATH}
 offroad_planner     planner       1        0          ./offroad_planner
 behavior_selector   planner       1        0          ./behavior_selector
 MPP                 planner       1        0          ./model_predictive_planner
 obstacle_avoider    planner       1        0          ./obstacle_avoider

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D
 Camera1             monitors      1        0          ./camera_viewer 1
