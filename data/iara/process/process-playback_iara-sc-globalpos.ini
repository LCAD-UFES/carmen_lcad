## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

## Path do mapa 2D (grade)
SET MAP_PATH=${PATH_CENTRAL}/geodata/test1/map_files
SET GRAPH_PATH=${MAP_PATH}/../graphs/saida_norte.gr
SET ANNOTATION_PATH=${MAP_PATH}/../annotations/annotations.txt
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini
SET RDDF_PATH=${MAP_PATH}/../rddf/rddf_saida_norte.txt
SET LIDAR_SENSOR_ID=0

SET LOG_PATH=/dados/logs_iara/iara_20260730-3/iara_20260730-3.txt


## Mapa 3D do SC-LIO-SAM (contem tambem o map_world_origin.txt)
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/mapa_saida_norte_ufes/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/param.yaml

# module name        group_name   requested_state  watch_heartbeats  command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0.01' -speed 1.0
 proccontrol_gui     support       1        0          ./proccontrol_gui
 mss                 support       1        0          ./map_server -map_path ${MAP_PATH} -block_map on

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
# ATENCAO: -mapping_mode ON. E' isso que faz o localize virar pass-through da
# fused_odometry em vez de rodar o filtro de particulas.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on -lidar 0 > caco_localize.txt
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D           monitors      1        0          ./viewer_3D

#### ROS / SC-LIO-SAM
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true > caco_bridge.txt
 SC-LIO-SAM          ros           0        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           0        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _world_origin_file:=${WORLD_ORIGIN} > caco_fused.txt 2>&1

