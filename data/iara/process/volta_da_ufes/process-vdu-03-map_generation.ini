# ETAPA 3 de 4 -- gera o MAPA 2D (grade do CARMEN) a partir das poses da etapa 2.
#
# Nao roda SC-LIO-SAM nem a ponte ROS: so' reproduz o log e usa as poses ja' calculadas.
# O graphslam_publish_globalpos le' as poses e publica globalpos DIRETO; o mapper grava a
# grade em MAP_FILES_PATH, dentro do geodata deste log. O localize_ackerman NAO entra no
# caminho (ver o bloco SLAM abaixo).
#
# MAP_X/MAP_Y abaixo TEM QUE SER trocados a cada log. O poses_opt_to_carmen.sh imprime os
# valores prontos ("SET MAP_X=...") -- rode-o sobre o arquivo de poses so' para ler o
# numero, mesmo sem precisar da conversao.
#
# Antes de rodar:  mkdir -p $CARMEN_HOME/data/iara/geodata/<LOG_NAME>
# (o mapper faz mkdir de UM nivel so'; se o pai nao existir ele morre com
#  "ERROR: mapper could not create new directory")
#
# Ordem de uso: deixe o playback_control parado, ligue tudo, rode o log inteiro, e SO' NO
# FIM ligue o complete_map (por isso ele esta em requested_state 0).
#
# Proxima etapa: process-vdu-04-sclio-globalpos.ini

## Log a usar -- descomente UM. Tudo o mais (mapa 2D, mapa 3D, poses) sai deste nome,
## entao trocar de log e' trocar SO' esta linha.
SET LOG_NAME=log_iara-2026-08-24_16-27-40
#SET LOG_NAME=log_iara-2026-08-24_16-43-39
#SET LOG_NAME=log_iara-2026-08-24_16-59-44

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

SET LOG_PATH=/dados/logs_iara/${LOG_NAME}/${LOG_NAME}.txt

## Tudo o que este log produzir fica junto, dentro do geodata da IARA
SET GEO_PATH=${PATH_CENTRAL}/geodata/${LOG_NAME}
SET MAP_FILES_PATH=${GEO_PATH}/map_files
## Vai direto pro arquivo do SC-LIO-SAM, sem converter: quem le' e' o
## graphslam_publish_globalpos, que aceita 4, 6, 7 ou 10 colunas.
## (O graphslam_publish ANTIGO le' so' 4 e desalinharia o fscanf em silencio.)
SET POSES_PATH=${GEO_PATH}/sc_lio_sam/optimized_poses.txt
## Caminho ABSOLUTO, terminando em "/": quem consome e' o roslaunch, e no' de ROS roda
## com cwd em ~/.ros, nao em bin/ -- um caminho relativo aqui iria parar no lugar errado.
## O $CARMEN_HOME e' expandido pelo bash que o proccontrol usa para lancar o modulo.
SET SC_LIO_SAM_MAP_PATH=$CARMEN_HOME/data/iara/geodata/${LOG_NAME}/sc_lio_sam/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt

## ATENCAO: estes logs sao de 2023, do Ford Escape com HDL32 -- o .ini de parametros e'
## o da sensorbox, NAO o carmen.ini. Conferido pelos parametros gravados dentro do log:
## lidar0_model HDL32, lidar0_shot_size 32, lidar0_ip 192.168.1.200.
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/param.yaml

## So' vale para lidar variable_scan; nestes logs a nuvem chega por VELODYNE_PARTIAL_SCAN
## e a ponte a pega pelo outro handler. Fica aqui porque o launch da ponte pede o arg.
SET LIDAR_SENSOR_ID=0

SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

## Origem do mapa -- TROCAR pelo que o poses_opt_to_carmen.sh imprimir.
## Valores abaixo: log_iara-2026-08-24_16-59-44 (primeira pose do poses_opt_carmen.dat).
SET MAP_X=7757308
SET MAP_Y=-363493

# module name         group_name    requested_state    watch_heartbeats    command_line

#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0'
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
# O localize_ackerman fica DESLIGADO: com o graphslam_publish_globalpos a globalpos sai
# direto do arquivo de poses, e o localize so' acrescentaria um casamento de timestamp a
# mais no meio -- ele pega a fused_odometry mais proxima e extrapola ds = v*dt sem teto,
# o que aplica pose velha em scan novo e mancha o mapa.
# Para voltar ao caminho antigo: religar aqui, e trocar o pub_poses pelo graphslam_publish.
# O -mapping_mode on do mapper continua obrigatorio: e' o que o autoriza a GRAVAR a grade.
 localize            SLAM          0        0          ./localize_ackerman -mapping_mode on > caco_localize.txt
# -lidar_id: casa a pose com o timestamp da PROPRIA mensagem de lidar (o padrao do
# binario e' 5, do outro veiculo). Sem casamento exato ele nao publica, de proposito.
 pub_poses           SLAM          1        0          ./graphslam_publish_globalpos ${POSES_PATH} -poses_from lidar -lidar_id ${LIDAR_SENSOR_ID}
# -interpolate_by_globalpos on: durante a varredura (~50 ms) o mapper interpola a pose
# entre as duas ultimas globalpos em vez de extrapolar pelo modelo de bicicleta (v, phi).
# O modelo estima a guinada pelo esterco -- bom em reta, ruim em curva -- e o erro de
# guinada aparece no mapa como a nuvem GIRADA um pouco. Aqui as poses vem do SC-LIO-SAM,
# entao a guinada real esta' na diferenca entre duas globalpos: usar ela e' mais fiel.
# So' tem efeito em -mapping_mode on.
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on -interpolate_by_globalpos on
 od_mapper           SLAM          0        0          ./obstacle_distance_mapper

#### interfaces
# -fv_flag on: sem ele o viewer_3D so' desenha nuvem depois da primeira mensagem
# do fused_odometry (odometry_initialized), que nao roda em nenhuma etapa destas.
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D -fv_flag on

#### graphSLAM
# LIGAR SO' DEPOIS QUE O LOG TERMINAR: junta os tiles num complete_map.* dentro do mapa
 complete_map        graphslam     0        0          ./build_complete_map -map_path ${MAP_FILES_PATH}; echo "Programa concluido normalmente"; sleep 30m
