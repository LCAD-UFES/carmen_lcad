# ETAPA 3 de 4 -- gera o MAPA 2D (grade do CARMEN) a partir das poses da etapa 2.
#
# Nao roda SC-LIO-SAM nem a ponte ROS: so' reproduz o log e usa as poses ja' calculadas.
# O graphslam_publish publica as poses, o localize vira pass-through delas e o mapper
# grava a grade em MAP_FILES_PATH, dentro do geodata deste log.
#
# MAP_X/MAP_Y abaixo TEM QUE SER trocados pelos valores que o poses_opt_to_carmen.sh
# imprimiu no fim da etapa 2 -- ele ja' entrega no formato "SET MAP_X=...".
#
# Antes de rodar:  mkdir -p $CARMEN_HOME/data/iara/geodata/<LOG_NAME>
# (o mapper faz mkdir de UM nivel so'; se o pai nao existir ele morre com
#  "ERROR: mapper could not create new directory")
#
# Ordem de uso: deixe o playback_control parado, ligue tudo, rode o log inteiro, e SO' NO
# FIM ligue o complete_map (por isso ele esta em requested_state 0).
#
# Proxima etapa: process-vdu-04-sclio-globalpos.ini

## Log a usar -- descomente UM. Tudo o mais (mapa 2D, mapa 3D, poses) sai deste nome,
## entao trocar de log e' trocar SO' esta linha.
#SET LOG_NAME=log_volta_da_ufes_20230422-1
#SET LOG_NAME=log_volta_da_ufes_20230425-1
#SET LOG_NAME=log_volta_da_ufes_20230507-2
#SET LOG_NAME=log_volta_da_ufes_20230509-1
SET LOG_NAME=log_volta_da_ufes_20230510-1

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

SET LOG_PATH=/dados/logs_iara/${LOG_NAME}/${LOG_NAME}.txt

## Tudo o que este log produzir fica junto, dentro do geodata da IARA
SET GEO_PATH=${PATH_CENTRAL}/geodata/${LOG_NAME}
SET MAP_FILES_PATH=${GEO_PATH}/map_files
SET POSES_PATH=${GEO_PATH}/poses_opt_carmen.dat
## Caminho ABSOLUTO, terminando em "/": quem consome e' o roslaunch, e no' de ROS roda
## com cwd em ~/.ros, nao em bin/ -- um caminho relativo aqui iria parar no lugar errado.
## O $CARMEN_HOME e' expandido pelo bash que o proccontrol usa para lancar o modulo.
SET SC_LIO_SAM_MAP_PATH=$CARMEN_HOME/data/iara/geodata/${LOG_NAME}/sc_lio_sam/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt

## ATENCAO: estes logs sao de 2023, do Ford Escape com HDL32 -- o .ini de parametros e'
## o da sensorbox, NAO o carmen.ini. Conferido pelos parametros gravados dentro do log:
## lidar0_model HDL32, lidar0_shot_size 32, lidar0_ip 192.168.1.200.
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen-ford-escape-sensorbox.ini
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/param.yaml

## So' vale para lidar variable_scan; nestes logs a nuvem chega por VELODYNE_PARTIAL_SCAN
## e a ponte a pega pelo outro handler. Fica aqui porque o launch da ponte pede o arg.
SET LIDAR_SENSOR_ID=0

SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

## Origem do mapa -- TROCAR pelo que o poses_opt_to_carmen.sh imprimir na etapa 2
SET MAP_X=7757721
SET MAP_Y=-363569

# module name         group_name    requested_state    watch_heartbeats    command_line

#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0'
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
# ATENCAO: -mapping_mode ON nos dois. No localize e' o que o faz virar pass-through das
# poses do graphslam_publish em vez de rodar o filtro de particulas; no mapper e' o que
# o autoriza a GRAVAR a grade.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on > caco_localize.txt
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on
 od_mapper           SLAM          0        0          ./obstacle_distance_mapper

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D

#### graphSLAM
 pub_poses           graphslam     1        0          ./graphslam_publish ${POSES_PATH}
# LIGAR SO' DEPOIS QUE O LOG TERMINAR: junta os tiles num complete_map.* dentro do mapa
 complete_map        graphslam     0        0          ./build_complete_map -map_path ${MAP_FILES_PATH}; echo "Programa concluido normalmente"; sleep 30m
