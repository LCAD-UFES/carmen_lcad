# ETAPA 4 de 4 -- localiza no mapa usando a globalpos do SC-LIO-SAM.
#
# Usa o mapa 3D da etapa 1 (para o SC-LIO-SAM se localizar) e o mapa 2D da etapa 3 (para o
# map_server / navigator_gui). O fused_odometry_from_slam_node injeta a pose do SLAM como
# fused_odometry do CARMEN, e o localize vira pass-through dela.
#
# Ligue o fused_odom_slam SO' DEPOIS que o robo encaixar no mapa no RViz -- por isso ele e
# o SC-LIO-SAM comecam em requested_state 0.
#
# NAO ligar o ./fused_odometry do CARMEN junto: publicaria carmen_fused_odometry_message
# em paralelo com o no' do ROS.

## Log a usar -- descomente UM. Tudo o mais (mapa 2D, mapa 3D, poses) sai deste nome,
## entao trocar de log e' trocar SO' esta linha.

## MAP
#SET LOG_NAME=log_iara-2026-08-24_16-27-40
#SET LOG_NAME=log_iara-2026-08-24_16-43-39
SET LOG_NAME=log_iara-2026-08-24_16-59-44


## LOGGE
#SET LOG_NAME2=log_iara-2026-08-24_16-27-40
SET LOG_NAME2=log_iara-2026-08-24_16-43-39
#SET LOG_NAME2=log_iara-2026-08-24_16-59-44

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

SET LOG_PATH=/dados/logs_iara/${LOG_NAME2}/${LOG_NAME2}.txt

## Tudo o que este log produzir fica junto, dentro do geodata da IARA
SET GEO_PATH=${PATH_CENTRAL}/geodata/${LOG_NAME}
SET MAP_FILES_PATH=${GEO_PATH}/map_files
SET POSES_PATH=${GEO_PATH}/poses_opt_carmen.dat
## Caminho ABSOLUTO, terminando em "/": quem consome e' o roslaunch, e no' de ROS roda
## com cwd em ~/.ros, nao em bin/ -- um caminho relativo aqui iria parar no lugar errado.
## O $CARMEN_HOME e' expandido pelo bash que o proccontrol usa para lancar o modulo.
SET SC_LIO_SAM_MAP_PATH=$CARMEN_HOME/data/iara/geodata/${LOG_NAME}/sc_lio_sam/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt

## ATENCAO: estes logs sao de 2023, do Ford Escape com HDL32 -- o .ini de parametros e'
## o da sensorbox, NAO o carmen.ini. Conferido pelos parametros gravados dentro do log:
## lidar0_model HDL32, lidar0_shot_size 32, lidar0_ip 192.168.1.200.
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/param.yaml
SET RDDF_PATH=${GEO_PATH}/rddf.txt

## So' vale para lidar variable_scan; nestes logs a nuvem chega por VELODYNE_PARTIAL_SCAN
## e a ponte a pega pelo outro handler. Fica aqui porque o launch da ponte pede o arg.
SET LIDAR_SENSOR_ID=0

SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

SET MAP_X=7757721
SET MAP_Y=-363569

# module name         group_name    requested_state    watch_heartbeats    command_line

#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0.01' -speed 1.0
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
# -mapping_mode ON: o localize vira pass-through da fused_odometry vinda do SLAM.
#
# ORDEM DE SUBIDA: o localize sobe em ~2 s e o publicador da pose (fused_odom_slam) vem de
# um roslaunch que leva dezenas de segundos. IPC_subscribe exige a mensagem ja' DEFINIDA,
# entao o localize assinava uma mensagem que ainda nao existia -- e a assinatura falhava EM
# SILENCIO: nenhum erro, o modulo rodando normal, e a globalpos nunca saindo. Medido:
# 240 scans e 474 fused_odometry no barramento, 0 globalpos publicada; reiniciar so' o
# localize, com o no' ROS ja' de pe', fazia subir para 240 globalpos.
# Resolvido na origem: carmen_fused_odometry_define_messages() e' chamada tanto no subscribe
# quanto no publish da interface (src/fused_odometry/fused_odometry_interface.c), entao quem
# chegar primeiro define. Nao depende mais de quem sobe antes.
#
# O '2>&1' NAO e' enfeite: o localize_ackerman imprime TUDO em stderr -- banner, avisos e
# erros. Com so' '>' o arquivo fica em 0 bytes mesmo com o modulo funcionando, e some a
# unica pista disponivel quando algo da' errado.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on > caco_localize.txt 2>&1
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH}
 od_mapper           SLAM          1        0          ./obstacle_distance_mapper
 rndf_build	         SLAM		   0		0		   ./rddf_build ${RDDF_PATH}
 

#### interfaces
# -fv_flag on: sem ele o viewer_3D so' desenha nuvem depois da primeira mensagem
# do fused_odometry (odometry_initialized), que nao roda em nenhuma etapa destas.
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      1        0          ./viewer_3D -fv_flag on

#### ROS / SC-LIO-SAM
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true > caco_bridge.txt
 SC-LIO-SAM          ros           1        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt

#### injecao da localizacao (ligar SO' depois do robo encaixar no mapa)
 fused_odom_slam     ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && rosrun carmen_ipc_bridge fused_odometry_from_slam_node _world_origin_file:=${WORLD_ORIGIN} > caco_fused.txt 2>&1

#### NAO LIGAR: publicaria carmen_fused_odometry_message em paralelo com o no' acima
# fused_odometry      filter        0        0          ./fused_odometry
