# Gera o mapa 3D com GPS e odometria Ackermann da IARA.
# A origem GPS é salva em map_world_origin.txt dentro do mapa.

SET LOG_NAME=log_iara-2026-10-02_15-09-00.txt
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/mapper_teste2/

SET PARAM_FILE=../data/iara/parameters/carmen.ini
SET PARAM_SC_LIO_SAM=../data/iara/parameters/param.yaml
SET LIDAR_SENSOR_ID=0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### Servicos de suporte
 param_daemon         support       1                  0                   ./param_daemon ${PARAM_FILE}
 proc_control         support       1                  0                   ./proccontrol_gui
 playback             support       1                  0                   ./playback /dados/${LOG_NAME}
 playback_control     support       1                  0                   ./playback_control -message 't 30' -speed 1.0

#### Dados dos sensores
 gps_xyz              filter        1                  0                   ./gps_xyz
 base_ackerman        filter        1                  0                   ./base_ackerman

#### Interfaces
 viewer_3D            interface     0                  0                   ./viewer_3D

#### SC-LIO-SAM
 SC-LIO-SAM           ros           1                  0                   sleep 1 && source ../src/sc_lio_sam/setup.bash && exec ros2 launch lio_sam run.launch.py params_file:=${PARAM_SC_LIO_SAM} map_directory:=${SC_LIO_SAM_MAP_PATH} localizationMode:=false posesEnable:=false > caco_sclio.txt
 carmen_ros_bridge    ros           1                  0                   source ../src/sc_lio_sam/setup.bash && exec ros2 launch carmen_ros_bridge carmen_ros_bridge.launch.py lidar_sensor_id:=${LIDAR_SENSOR_ID} params_file:=${PARAM_SC_LIO_SAM}
