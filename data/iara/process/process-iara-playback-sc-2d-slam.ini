# Gera o mapa 2D CARMEN com as poses da etapa poses-opt; não executa ROS.
# MAP_X/MAP_Y são lidos da origem GPS do mapa em cada inicialização.

SET LOG_NAME=log_iara-2026-10-02_15-09-00.txt
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/mapper_teste2/
SET POSES_PATH=/dados/sc_lio_sam_output/poses_opt.dat
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d
SET MAP_X=$(awk 'NF >= 6 && $1 ~ /^[-+0-9]/ {printf "%d", $1; exit}' ${WORLD_ORIGIN})
SET MAP_Y=$(awk 'NF >= 6 && $1 ~ /^[-+0-9]/ {printf "%d", $2; exit}' ${WORLD_ORIGIN})

SET PARAM_FILE=../data/iara/parameters/carmen.ini
SET LIDAR_SENSOR_ID=0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### Servicos de suporte
 param_daemon         support       1                  0                   ./param_daemon ${PARAM_FILE}
 proc_control         support       1                  0                   ./proccontrol_gui
 playback             support       1                  0                   ./playback /dados/${LOG_NAME}
 playback_control     support       1                  0                   ./playback_control -message 't 30' -speed 1.0
 map_server           support       1                  0                   test -s ${WORLD_ORIGIN} && exec ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### Dados dos sensores
 base_ackerman        filter        1                  0                   ./base_ackerman

#### SLAM
 mapper               SLAM          1                  0                   ./mapper -map_path ${MAP_PATH} -mapping_mode on -pose_gate_max_delay 0.06

#### Interfaces
 navigator_gui        interface     1                  0                   ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D            interface     0                  0                   ./viewer_3D

#### Poses otimizadas
 pub_poses            graphslam     1                  0                   ./graphslam_publish_globalpos ${POSES_PATH} -poses_from lidar -lidar_id ${LIDAR_SENSOR_ID}
# Ative somente após terminar o playback, para juntar os blocos do mapa.
 complete_map         graphslam     0                  0                   ./build_complete_map -map_path ${MAP_PATH}; echo "Programa concluido normalmente"; sleep 30m
