## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

## Path do mapa
SET MAP_PATH=${PATH_CENTRAL}/geodata/

## Rota do mapa
SET GRAPH_PATH=${MAP_PATH}/

## Anotação do mapa
SET ANNOTATION_PATH=${PATH_CENTRAL}/geodata/annotations/annotations.txt

## Path da minsão
SET MISSION_PATH=${MAP_PATH}/../missions/

## Paramentos
#SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters_ini_new/astro.ini
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini

## RDDF para o bluid RDDF
SET RDDF_PATH=${PATH_CENTRAL}/geodata/


## Sensor para usar no ROS
SET LIDAR_SENSOR_ID=0

## local do log para o playback
#SET LOG_PATH=/dados/logs_iara/iara_20260728-3/iara_20260728-3.txt
#SET LOG_PATH=/dados/logs_iara/iara_20260730-1/iara_20260730-1.txt
SET LOG_PATH=/dados/logs_iara/iara_20260730-3/iara_20260730-3.txt
#SET LOG_PATH=/dados/iara_20260730-3.txt

## Path de onde ele vai salvar o mapa 3D
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/mapper_teste2/


SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0


SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters/param.yaml

#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 30' -speed 1.0
 proccontrol_gui     support       1        0          ./proccontrol_gui

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman
 viewer_3D           monitors      0        0          ./viewer_3D

#### SLAM
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode off -lidar 0 > caco1.txt
 
#### SC-LIO-SAM
 SC-LIO-SAM          ros           0        0          sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && roslaunch lio_sam run.launch localizationMode:=false params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco2.txt
 ros_bridge          ros           1        0          source ../src/sc_lio_sam/devel/setup.bash && roslaunch carmen_ipc_bridge carmen_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} use_sim_time:=true > caco3.txt
