# Localiza no mapa 3D da IARA e publica globalpos no CARMEN.
# Usa a origem GPS salva; mapa 2D em modo de leitura e poses_opt.dat preservado.

SET LOG_NAME=log_iara-2026-10-02_15-09-00.txt
SET SC_LIO_SAM_MAP_PATH=/dados/sc_lio_sam_output/mapper_teste2/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt
SET MAP_PATH=${SC_LIO_SAM_MAP_PATH}map2d
SET MAP_X=$(awk 'NF >= 6 && $1 ~ /^[-+0-9]/ {printf "%d", $1; exit}' ${WORLD_ORIGIN})
SET MAP_Y=$(awk 'NF >= 6 && $1 ~ /^[-+0-9]/ {printf "%d", $2; exit}' ${WORLD_ORIGIN})

SET PARAM_FILE=../data/iara/parameters/carmen.ini
SET PARAM_SC_LIO_SAM=../data/iara/parameters/param.yaml
SET LIDAR_SENSOR_ID=0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### Servicos de suporte
 param_daemon         support       1                  0                   ./param_daemon ${PARAM_FILE}
 proc_control         support       1                  0                   ./proccontrol_gui
 playback             support       1                  0                   ./playback /dados/${LOG_NAME}
 playback_control     support       1                  0                   ./playback_control -message 't 30' -speed 1.0
 map_server           support       1                  0                   test -s ${WORLD_ORIGIN} && exec ./map_server -map_path ${MAP_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### Dados dos sensores
 gps_xyz              filter        1                  0                   ./gps_xyz
 base_ackerman        filter        1                  0                   ./base_ackerman

#### SLAM
# Converte fused_odometry da ponte ROS em globalpos.
 localize             SLAM          1                  0                   ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID} > caco_localize.txt
 mapper               SLAM          1                  0                   ./mapper -map_path ${MAP_PATH} -mapping_mode off
 od_mapper            SLAM          1                  0                   ./obstacle_distance_mapper

#### Interfaces
 navigator_gui        interface     1                  0                   ./navigator_gui2 -map_path ${MAP_PATH}
 viewer_3D            interface     0                  0                   ./viewer_3D

#### SC-LIO-SAM
# GPS/Scan Context auxiliam o encaixe; se necessário, use 2D Pose Estimate no RViz.
 SC-LIO-SAM           ros           1                  0                   sleep 1 && source ../src/sc_lio_sam/setup.bash && exec ros2 launch lio_sam run.launch.py params_file:=${PARAM_SC_LIO_SAM} map_directory:=${SC_LIO_SAM_MAP_PATH} localizationMode:=true posesEnable:=false > caco_sclio.txt
 carmen_ros_bridge    ros           1                  0                   test -s ${WORLD_ORIGIN} && source ../src/sc_lio_sam/setup.bash && exec ros2 launch carmen_ros_bridge carmen_ros_bridge.launch.py lidar_sensor_id:=${LIDAR_SENSOR_ID} params_file:=${PARAM_SC_LIO_SAM} fused_odometry:=true world_origin_file:=${WORLD_ORIGIN}
