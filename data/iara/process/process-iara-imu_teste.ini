# Bancada para conferir se uma IMU esta' funcionando, sem subir o resto do carro.
#
# Sobe so' o que e' preciso: central, param_daemon, o driver ./xsens e o painel
# ./imu_teste. Nao ha' log, mapa, localizacao nem navegacao aqui.
#
# O QUE OLHAR NO PAINEL
#   acelerometro  parado deve dar |v| ~ 9.81 m/s2  -- e' a gravidade, e o eixo que
#                 estiver apontando para cima carrega quase tudo. Vire o sensor:
#                 o valor migra entre X, Y e Z e a norma continua 9.81.
#   giroscopio    parado deve dar |v| ~ 0 rad/s (so' ruido de bias). Girando o
#                 sensor, o eixo do giro sobe e volta a zero quando voce para.
#   magnetometro  |v| ~ 1.0 a.u. -- o MTi normaliza pelo campo terrestre local.
#                 Encoste um ima ou um imprevisto de ferro e veja estourar.
#   orientacao    horizonte artificial (roll/pitch) e mostrador de yaw, saidos do
#                 filtro de Kalman do proprio sensor.
#   perdidas      quanto o driver esta' jogando fora do que o sensor gera.
#
# ANTES DE RODAR -- as duas coisas que costumam travar o teste:
#
#   1. Permissao na porta. O usuario precisa estar no grupo dialout:
#          sudo usermod -aG dialout $USER      (exige relogar)
#      Para destravar so' nesta sessao:
#          sudo chmod 666 /dev/ttyUSB0
#
#   2. Baudrate. O MTi sai de fabrica em 115200 e a IARA usa 460800. Errando o
#      valor, o ./xsens morre no EXIT_ON_ERROR do doHardwareScan() sem dizer
#      qual foi o problema. Para descobrir em que baudrate o seu esta', veja o
#      readme de src/imu_teste.
#
# XSENS_MODE: 6 = TEMP|CALIB|ORIENT, que e' o unico que traz acc/gyr/mag junto
# com a orientacao. O ini da IARA usa 5 (TEMP|ORIENT), em que os tres vetores
# saem ZERADOS -- com 5 este painel mostraria tres barras mortas.

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

## Parametros
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini

## Porta e baudrate do sensor sob teste.
## /dev/iara_xsens e' o symlink de udev do carro; numa bancada costuma ser ttyUSB0.
SET XSENS_DEV=/dev/ttyUSB0
SET XSENS_BAUDRATE=115200

## Formato dos dados pedidos ao sensor (ver comentarios em carmen.ini)
SET XSENS_MODE=6
SET XSENS_SETTINGS=1

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 proccontrol_gui     support       1        0          ./proccontrol_gui

#### driver da IMU
 xsens               imu           1        0          ./xsens -xsens_mti_dev ${XSENS_DEV} -xsens_mti_baudrate ${XSENS_BAUDRATE} -xsens_mti_mode ${XSENS_MODE} -xsens_mti_settings ${XSENS_SETTINGS}

#### painel de conferencia
 imu_teste           interface     1        0          ./imu_teste

#### saida em texto, para conferir numero a numero ou redirecionar para arquivo.
#### Desligado por padrao: ele imprime a 100 Hz e polui o terminal.
 xsens_listener      interface     0        0          ./xsens_listener
