# Gera o mapa 2D (grade do CARMEN) a partir das poses otimizadas do SC-LIO-SAM.
#
# Este process NAO roda SC-LIO-SAM nem a ponte ROS: ele so' reproduz o log e usa as
# poses que ja' foram calculadas, para o mapper gravar a grade.
#
# Receita completa (as duas primeiras etapas usam os process-*-sc-*.ini desta pasta):
#
#   1. Mapa 3D          -- SC-LIO-SAM com localizationMode:=false, grava em
#                          SC_LIO_SAM_MAP_PATH (cloudGlobal.pcd, Scans/, SCDs/).
#
#   2. Poses            -- MESMO log de novo, agora com localizationMode:=true.
#                          Com posesEnable: true no param.yaml, o SC-LIO-SAM grava o
#                          poses_opt.dat (10 colunas, ja' em UTM porque
#                          posesOriginMode: "gps" ancora a origem no GPS real).
#
#   3. Converter        -- cd $CARMEN_HOME/bin
#                          ./poses_opt_to_carmen.sh /dados/sc_lio_sam_output/poses_opt.dat
#                          O graphslam_publish le' SEMPRE 4 colunas "x y theta timestamp";
#                          sem converter, o fscanf desalinha o arquivo inteiro e as poses
#                          publicadas viram lixo, sem nenhuma mensagem de erro.
#                          O script imprime no fim os valores de MAP_X/MAP_Y para colar
#                          aqui embaixo, e confere se as poses se sobrepoem ao log.
#
#   4. Este process     -- gera a grade 2D.
#
# Ordem de uso aqui: deixe o playback_control parado, ligue tudo, rode o log inteiro,
# e SO' NO FIM ligue o complete_map (ele fica em requested_state 0 de proposito).

## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/iara

## Log -- tem que ser O MESMO log de onde sairam as poses da etapa 2
#SET LOG_PATH=/dados/logs_iara/iara_20260728-3/iara_20260728-3.txt
#SET LOG_PATH=/dados/logs_iara/iara_20260730-1/iara_20260730-1.txt
SET LOG_PATH=/dados/logs_iara/iara_20260730-3/iara_20260730-3.txt

## Parametros
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters/carmen.ini

## Poses ja' convertidas para as 4 colunas do graphslam_publish (etapa 3)
SET POSES_PATH=/dados/sc_lio_sam_output/poses_opt_carmen.dat

## Mapa 2D que este process vai GRAVAR
SET MAP_FILES_PATH=${PATH_CENTRAL}/geodata/iara_20260730-3/map_files

## Origem do mapa -- trocar pelos valores que o poses_opt_to_carmen.sh imprime.
## Os de agora vieram do map_world_origin.txt do mapa_saida_norte_ufes.
SET MAP_X=7757903
SET MAP_Y=-363731

SET LIDAR_SENSOR_ID=0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### serviccos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0'
 proccontrol_gui     support       1        0          ./proccontrol_gui
 map_server          support       1        0          ./map_server -map_path ${MAP_FILES_PATH} -map_x ${MAP_X} -map_y ${MAP_Y} -block_map on -lanemap_incoming_message_type 0

#### processamento dos dados dos sensores
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### SLAM
# ATENCAO: -mapping_mode ON nos dois. No localize e' o que o faz virar pass-through das
# poses publicadas pelo graphslam_publish, em vez de rodar o filtro de particulas;
# no mapper e' o que o autoriza a GRAVAR a grade em MAP_FILES_PATH.
 localize            SLAM          1        0          ./localize_ackerman -mapping_mode on -lidar ${LIDAR_SENSOR_ID} > caco_localize.txt
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on
 od_mapper           SLAM          0        0          ./obstacle_distance_mapper

#### interfaces
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D

#### graphSLAM
 pub_poses           graphslam     1        0          ./graphslam_publish ${POSES_PATH}
# LIGAR SO' DEPOIS QUE O LOG TERMINAR: junta os tiles num complete_map.* dentro do MAP_FILES_PATH
 complete_map        graphslam     0        0          ./build_complete_map -map_path ${MAP_FILES_PATH}; echo "Programa concluido normalmente"; sleep 30m
