# Configuracao do servico pi_nit_server (instalado em /etc/pi_nit/pi_nit_server.conf).
# Formato EnvironmentFile do systemd: CHAVE=valor, sem aspas, sem espacos ao redor do '='.
# Depois de editar:  sudo systemctl restart pi_nit_server

# Modelo compilado para o Hailo-8L (precisa ter NMS embarcado)
PI_NIT_HEF=/opt/pi_nit/models/yolov8s_h8l.hef

# Backend de inferencia:
#   hailort   - padrao. Usa a API Python do HailoRT direto no frame. E' o que
#               funciona no Ubuntu 24.04 Server sem instalar o Tappas.
#   gstreamer - reaproveita o pipeline hailonet + hailofilter (mesmo caminho
#               do reference/camera_pipeline.py). Exige hailo-tappas-core.
PI_NIT_BACKEND=hailort

# Usados apenas quando PI_NIT_BACKEND=gstreamer (vazio = caminho padrao do Tappas)
PI_NIT_POSTPROCESS_SO=
PI_NIT_POSTPROCESS_CONFIG=

# Porta PUB para o pi_nit_viewer mostrar as cameras na tela. 0 = desligado.
# Ligar custa quase nada: o PUB descarta sozinho se ninguem estiver olhando.
PI_NIT_VIEWER_PORT=0

# Portas ZMQ (o Raspberry faz bind; o PC do CARMEN conecta nelas)
PI_NIT_FRAME_PORT=5560
PI_NIT_RESULT_PORT=5561

# Interface de bind. 0.0.0.0 aceita de qualquer rede; troque pelo IP do
# Raspberry na rede do veículo para restringir o acesso.
PI_NIT_BIND=0.0.0.0

# Imagens por inferencia: TEM que ser igual ao numero de cameras.
# Com 3 cameras, o Hailo recebe as 3 de uma vez (derruba o tempo por imagem
# de ~30 para ~10 ms). Com 1 camera, deixe 1: um batch maior faz o detector
# repetir a mesma imagem para completar o lote e descartar os resultados
# extras - com batch 3 e uma camera, dois tercos do acelerador trabalham a
# toa (hailo_person_detector.py:145). O servico avisa no log quando o batch
# configurado nao bate com o numero de cameras que estao publicando.
PI_NIT_BATCH_SIZE=1

# Quanto esperar (ms) pelas outras cameras antes de mandar o batch. So' e'
# esperado enquanto faltam cameras que estao mesmo publicando: com uma camera
# so', o servidor infere na hora (antes ele pagava a janela inteira em todo
# frame, e 15 Hz de camera viravam 9 fps de deteccao).
PI_NIT_BATCH_WINDOW_MS=20

# Confianca minima devolvida ao CARMEN (o cliente pode filtrar mais ainda)
PI_NIT_CONFIDENCE=0.35

# Classes COCO devolvidas. O conjunto abaixo e' o que o MOT sabe nomear
# (multiple_object_tracker.cpp:1012), ja que o obj_id publicado e' o id COCO
# menos 1:
#   0 pessoa -> -1 pedestrian | 2 carro -> 1 Car | 3 moto -> 2 motorcycle
#   5 onibus -> 4 bus         | 7 caminhao -> 6 truck
# A bicicleta (1) vira 0, que o MOT mostra como "unknown" - deixe fora se isso
# incomodar. 'all' devolve tudo, inclusive cachorro e mochila.
PI_NIT_CLASSES=0,2,3,5,7

# 1 = nao usa o Hailo, devolve uma caixa fixa (so para testar o enlace ZMQ)
PI_NIT_DUMMY=0

PI_NIT_LOG_LEVEL=INFO
