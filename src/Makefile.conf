# ---------------------------------------------------------------------------------------
# Migração Ubuntu 26.04 (ver doc/migracao_ubuntu26/): detecção automática de paths de libs
# que mudaram de lugar entre o Ubuntu 20.04 (instalação manual em /usr/local) e o 26.04
# (pacotes apt em /usr). Tudo aqui é ADITIVO: um -I para diretório inexistente é ignorado
# pelo gcc, então isso continua funcionando em máquinas antigas.
# ---------------------------------------------------------------------------------------

# Dezenas de Makefiles fixam a versão do PCL/VTK no -I (ex.: pcl-1.8, vtk-7.1), que era o
# que o build manual do tutorial de 20.04 instalava em /usr/local. O libpcl-dev do apt no
# 26.04 instala em /usr/include/pcl-1.15. Detecta o que estiver realmente instalado.
IFLAGS += $(addprefix -I,$(wildcard /usr/local/include/pcl-* /usr/include/pcl-*))
IFLAGS += $(addprefix -I,$(wildcard /usr/local/include/vtk-* /usr/include/vtk-*))

# g2o: os #include do código já usam o prefixo "g2o/...", e o libg2o-dev do apt instala em
# /usr/include/g2o (path padrão do gcc) — não precisa de -I. O que precisa é o cs.h: o
# header g2o/solvers/csparse/csparse_extension.h faz #include <cs.h> sem prefixo. Antes isso
# vinha do EXTERNAL/csparse/ vendorizado (-I/usr/local/include/EXTERNAL/csparse/, que não
# existe mais); no apt o cs.h vem do libsuitesparse-dev, em /usr/include/suitesparse.
IFLAGS += -I/usr/include/suitesparse

# libtf (incluída transitivamente por quase todo módulo) precisa dos headers LinearMath do
# Bullet. Vários Makefiles só têm -I/usr/local/include/bullet/ (path do build manual);
# o libbullet-dev do apt instala em /usr/include/bullet.
IFLAGS += -I/usr/include/bullet

# Vários módulos incluem <Python.h> — direta ou transitivamente, via
# carmen/voice_interface_interface.h — e fixavam -I/usr/include/python3.5, 3.6 ou 3.8. O
# Ubuntu 26.04 traz Python 3.14, então nenhum desses paths existe. Detectado via pkg-config
# (aditivo e inofensivo para quem não usa Python).
IFLAGS += $(shell pkg-config --cflags python3 2>/dev/null || python3-config --includes 2>/dev/null)

# Idem para os headers do numpy (<numpy/arrayobject.h>, usado pelos módulos que embutem
# Python, ex.: mapper/lib_neural_mapper_py). O caminho mudou de lugar entre versões do
# numpy/Python; perguntar ao próprio numpy é o único jeito estável.
IFLAGS += $(addprefix -I,$(shell /usr/bin/env python3 -c "import numpy; print(numpy.get_include())" 2>/dev/null))

# Alguns módulos linkam VTK com o sufixo de versão no nome da lib (-lvtkRenderingCore-7.1).
# VTK não publica .pc nem alias sem versão, então não dá pra resolver só com -I/-L: o sufixo
# faz parte do -l. Detecta a versão instalada de verdade (9.5 no 26.04) e os Makefiles usam
# $(VTK_LIB_SUFFIX) no lugar do valor fixo.
VTK_LIB_SUFFIX := $(patsubst libvtkCommonCore-%.so,%,$(notdir $(firstword $(wildcard /usr/lib/x86_64-linux-gnu/libvtkCommonCore-*.so /usr/lib/*/libvtkCommonCore-*.so /usr/local/lib/libvtkCommonCore-*.so))))

